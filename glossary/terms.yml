    zh-CN: 审批
    ja: 承認
    fr: Approbation
    ko: 승인
    es: Aprobación
    de: Freigabe
    pt: Aprovação
    vi: Phê duyệt
    keep_english: false
    note: Human confirmation before high-risk operations.

