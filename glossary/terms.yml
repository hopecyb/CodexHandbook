    en: Agent
    zh-CN: Agent
    ja: Agent
    fr: Agent
    ko: Agent
    es: Agent
    de: Agent
    pt: Agent
    vi: Agent
    keep_english: true
    note: Execution approach that calls tools and iterates toward a goal. Do not translate.

  - id: approval
