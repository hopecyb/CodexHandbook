<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">Hoja de ruta de ingeniería de aplicaciones de IA</title>
  <desc id="desc">Línea de tiempo vertical en orden inverso: de Harness Engineering, Skills, ingeniería del contexto, colaboración multiagente, uso de herramientas, MCP, llamadas a funciones e ingeniería de prompts hasta RAG. Cada fecha se refiere solo a la publicación del artículo, anuncio o texto citado.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #111827; font-size: 25.6px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 12.8px; }
    .year { fill: #2563eb; font-size: 14.4px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 14.4px; font-weight: 700; }
    .node-date { fill: #6b7280; font-size: 10.4px; }
    .node-body { fill: #374151; font-size: 11.2px; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" fill="#ffffff"/>
  <rect x="42" y="34" width="816" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="86" class="title">Hoja de ruta de ingeniería de aplicaciones de IA</text>
  <text x="72" y="122" class="subtitle">Del más reciente al más antiguo. Las fechas son de las fuentes de la tabla, no del origen del concepto.</text>
  <text x="72" y="148" class="subtitle">Lectura vertical: arnés y reutilización → colaboración → protocolo → entrada → anclaje.</text>

  <line x1="224" y1="218" x2="224" y2="1398" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-main)"/>

  <g transform="translate(70 1325)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2020</text>
  </g>
  <g transform="translate(70 1179)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2022</text>
  </g>
  <g transform="translate(70 1033)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2023</text>
  </g>
  <g transform="translate(70 887)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2024</text>
  </g>
  <g transform="translate(70 558)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2025</text>
  </g>
  <g transform="translate(70 229)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2026</text>
  </g>
  <g transform="translate(240 202)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#dc2626"/>
    <text x="28" y="32" class="node-title">Harness Engineering (arnés de ejecución)</text>
    <text x="28" y="55" class="node-date">2026-02-11 · Entorno de ejecución verificable</text>
    <text x="28" y="78" class="node-body">Unir herramientas, contexto, feedback, recuperación y calidad en un andamiaje estable.</text>
  </g>
  <g transform="translate(240 348)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Skills (habilidades)</text>
    <text x="28" y="55" class="node-date">2025-10-16 · Unidades de flujo reutilizables</text>
    <text x="28" y="78" class="node-body">Empaquetar prompts, pasos, ejemplos, scripts y recursos para reutilizar experiencia.</text>
  </g>
  <g transform="translate(240 470)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Context Engineering (ingeniería del contexto)</text>
    <text x="28" y="55" class="node-date">2025-09-29 · Diseño del contexto</text>
    <text x="28" y="78" class="node-body">De «escribir un buen prompt» a «decidir qué ve el modelo y con qué prioridad».</text>
  </g>
  <g transform="translate(240 592)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Multi-agent (colaboración entre agentes)</text>
    <text x="28" y="55" class="node-date">2025-06-13 · Colaboración por roles</text>
    <text x="28" y="78" class="node-body">Repartir investigación, implementación, revisión y verificación entre roles en paralelo.</text>
  </g>
  <g transform="translate(240 714)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#0d9488"/>
    <text x="28" y="32" class="node-title">Tool Use (uso de herramientas)</text>
    <text x="28" y="55" class="node-date">2025-03-11 · Ejecución con varias herramientas</text>
    <text x="28" y="78" class="node-body">El modelo elige herramientas, las llama, lee resultados y sigue razonando.</text>
  </g>
  <g transform="translate(240 860)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#9333ea"/>
    <text x="28" y="32" class="node-title">MCP (protocolo de contexto de modelo)</text>
    <text x="28" y="55" class="node-date">2024-11-25 · Protocolo de herramientas</text>
    <text x="28" y="78" class="node-body">Exponer herramientas, recursos, prompts y contexto como protocolo, sin integraciones ad hoc.</text>
  </g>
  <g transform="translate(240 1006)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Function Calling (llamadas a funciones)</text>
    <text x="28" y="55" class="node-date">2023-06-13 · Acciones estructuradas</text>
    <text x="28" y="78" class="node-body">El modelo no solo genera texto: llama funciones, API y acciones de negocio.</text>
  </g>
  <g transform="translate(240 1152)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Prompt Engineering (ingeniería de prompts)</text>
    <text x="28" y="55" class="node-date">2022-11-30 · Control de entrada</text>
    <text x="28" y="78" class="node-body">Guiar al modelo hacia una salida útil con instrucciones, ejemplos y restricciones de formato.</text>
  </g>
  <g transform="translate(240 1298)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#f97316"/>
    <text x="28" y="32" class="node-title">RAG (generación aumentada por recuperación)</text>
    <text x="28" y="55" class="node-date">2020-05-22 · Anclaje en conocimiento</text>
    <text x="28" y="78" class="node-body">Recuperar fuentes externas al contexto para reducir alucinaciones y respaldar respuestas.</text>
  </g>
</svg>
