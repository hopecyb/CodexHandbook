<svg lang="vi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">Lộ trình kỹ thuật ứng dụng AI</title>
  <desc id="desc">Dòng thời gian dọc theo thứ tự ngược: từ Harness Engineering, Skills, kỹ thuật ngữ cảnh, phối hợp đa tác nhân, sử dụng công cụ, MCP, gọi hàm và kỹ thuật prompt về RAG. Mỗi ngày chỉ là ngày công bố của bài báo, thông báo hoặc bài viết được dẫn.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #111827; font-size: 26.2px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13.1px; }
    .year { fill: #2563eb; font-size: 14.8px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 14.8px; font-weight: 700; }
    .node-date { fill: #6b7280; font-size: 10.7px; }
    .node-body { fill: #374151; font-size: 11.5px; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" fill="#ffffff"/>
  <rect x="42" y="34" width="816" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="86" class="title">Lộ trình kỹ thuật ứng dụng AI</text>
  <text x="72" y="122" class="subtitle">Mới nhất trước. Ngày là của nguồn trong bảng, không phải lúc khái niệm ra đời.</text>
  <text x="72" y="148" class="subtitle">Đọc từ trên xuống: khung và tái sử dụng → phối hợp → giao thức → đầu vào → tri thức.</text>

  <line x1="224" y1="218" x2="224" y2="1398" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-main)"/>

  <g transform="translate(70 1325)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2020</text>
  </g>
  <g transform="translate(70 1179)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2022</text>
  </g>
  <g transform="translate(70 1033)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2023</text>
  </g>
  <g transform="translate(70 887)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2024</text>
  </g>
  <g transform="translate(70 558)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2025</text>
  </g>
  <g transform="translate(70 229)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2026</text>
  </g>
  <g transform="translate(240 202)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#dc2626"/>
    <text x="28" y="32" class="node-title">Harness Engineering (khung thực thi)</text>
    <text x="28" y="55" class="node-date">2026-02-11 · Môi trường thực thi kiểm chứng được</text>
    <text x="28" y="78" class="node-body">Gộp công cụ, ngữ cảnh, phản hồi, khôi phục và kiểm tra chất lượng thành khung ổn định.</text>
  </g>
  <g transform="translate(240 348)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Skills (kỹ năng)</text>
    <text x="28" y="55" class="node-date">2025-10-16 · Đơn vị quy trình tái sử dụng</text>
    <text x="28" y="78" class="node-body">Đóng gói prompt, bước, ví dụ, script và tài nguyên để AI tái sử dụng kinh nghiệm.</text>
  </g>
  <g transform="translate(240 470)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Context Engineering (kỹ thuật ngữ cảnh)</text>
    <text x="28" y="55" class="node-date">2025-09-29 · Thiết kế ngữ cảnh</text>
    <text x="28" y="78" class="node-body">Từ “viết prompt tốt” sang “thiết kế mô hình thấy gì và theo thứ tự ưu tiên nào”.</text>
  </g>
  <g transform="translate(240 592)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Multi-agent (phối hợp đa tác nhân)</text>
    <text x="28" y="55" class="node-date">2025-06-13 · Phối hợp theo vai trò</text>
    <text x="28" y="78" class="node-body">Chia nghiên cứu, triển khai, review và kiểm chứng cho các vai trò chạy song song.</text>
  </g>
  <g transform="translate(240 714)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#0d9488"/>
    <text x="28" y="32" class="node-title">Tool Use (sử dụng công cụ)</text>
    <text x="28" y="55" class="node-date">2025-03-11 · Thực thi nhiều công cụ</text>
    <text x="28" y="78" class="node-body">Mô hình chọn công cụ, gọi công cụ, đọc kết quả rồi suy luận tiếp.</text>
  </g>
  <g transform="translate(240 860)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#9333ea"/>
    <text x="28" y="32" class="node-title">MCP (giao thức ngữ cảnh mô hình)</text>
    <text x="28" y="55" class="node-date">2024-11-25 · Giao thức công cụ</text>
    <text x="28" y="78" class="node-body">Đưa công cụ, tài nguyên, prompt và ngữ cảnh thành giao thức, bớt tích hợp đơn lẻ.</text>
  </g>
  <g transform="translate(240 1006)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Function Calling (gọi hàm)</text>
    <text x="28" y="55" class="node-date">2023-06-13 · Hành động có cấu trúc</text>
    <text x="28" y="78" class="node-body">Mô hình không chỉ sinh văn bản mà gọi hàm, API và nghiệp vụ với tham số có cấu trúc.</text>
  </g>
  <g transform="translate(240 1152)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Prompt Engineering (kỹ thuật prompt)</text>
    <text x="28" y="55" class="node-date">2022-11-30 · Kiểm soát đầu vào</text>
    <text x="28" y="78" class="node-body">Dẫn mô hình tới đầu ra dùng được bằng mô tả nhiệm vụ, ví dụ và ràng buộc định dạng.</text>
  </g>
  <g transform="translate(240 1298)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#f97316"/>
    <text x="28" y="32" class="node-title">RAG (sinh tăng cường bằng truy xuất)</text>
    <text x="28" y="55" class="node-date">2020-05-22 · Neo vào tri thức</text>
    <text x="28" y="78" class="node-body">Đưa nguồn bên ngoài vào ngữ cảnh để giảm ảo giác và truy vết câu trả lời.</text>
  </g>
</svg>
