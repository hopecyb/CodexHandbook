<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Codex subagent orchestration architecture</title>
  <desc id="desc">The main Agent retains goals, constraints, and permissions while delegating bounded work. Subagents inherit the sandbox and may share a workspace; they return evidence for conflict resolution, merging, and final verification.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.2px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.4px; }
    .label { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.6px; }
    .tiny { fill: #94a3b8; font-size: 10.9px; }
    .lane { fill: #fbbf24; font-size: 11.8px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Main Agent orchestrates, subagents focus, evidence returns to the main thread for acceptance</text>
  <text x="44" y="75" class="sub">Parallelize bounded read-only work first. Context isolation is not file isolation; write tasks need separate ownership.</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">Main Agent: retain global control</text>
  <text x="600" y="177" text-anchor="middle" class="note">User goal · constraints · plan · permission mode</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">Define subtask contracts, decide whether to adopt results, own the final response</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">Bounded delegation contract</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">Subagent A</text>
  <text x="192" y="388" text-anchor="middle" class="note">Read-only code path</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">Deliver: call chain and file locations</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">Independent context · inherited permissions</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">Can run with other read-only tasks</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">Subagent B</text>
  <text x="600" y="388" text-anchor="middle" class="note">Locate tests and reproduction</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">Deliver: failing command and logs</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">Independent context · inherited permissions</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">Conclusions must be reproducible</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">Subagent C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">Review options or recent changes</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">Deliver: options, evidence, and risks</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">Independent context · inherited permissions</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">Adds token and consolidation cost</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">Shared execution boundary</text>
  <text x="600" y="566" text-anchor="middle" class="note">Sandbox and permission mode inherit from the main task; several Agents may see one workspace</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">Concurrent writes to one file conflict: assign ownership by directory, component, or worktree, then merge in the main thread.</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">Main Agent consolidates, resolves conflicts, and verifies</text>
  <text x="600" y="721" text-anchor="middle" class="note">Compare evidence → decide edits → merge → rerun tests and build</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">Subtask completion is not task completion; only reproducible evidence supports the final conclusion.</text>
</svg>
