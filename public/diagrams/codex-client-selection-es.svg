<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Selección de cliente Codex</title>
  <desc id="desc">Empieza donde ocurre el trabajo: App de escritorio para control local de tareas, CLI para terminales y scripts, integración IDE para el archivo y la selección actuales, y Cloud para repositorios remotos y entornos aislados. Los puntos de entrada pueden pasarse el trabajo; elige el más cercano al contexto y más fácil de revisar.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.8px; }
    .label { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12px; }
    .tiny { fill: #94a3b8; font-size: 10.4px; }
    .badge { fill: #020617; font-size: 10.4px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Empieza por dónde ocurre el trabajo y luego elige un punto de entrada de Codex</text>
  <text x="44" y="75" class="sub">No es un ranking de capacidades ni una elección única entre cuatro. Prefiere el punto de entrada más cercano al contexto y más fácil de revisar.</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">¿Dónde ocurre principalmente este trabajo?</text>
  <text x="600" y="171" text-anchor="middle" class="note">Gestión de tareas · terminal · editor · repositorio remoto</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">Punto de partida predeterminado</text>
  <text x="62" y="358" class="label">App de escritorio</text>
  <text x="62" y="389" class="note">Consola local de tareas</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">Ver tareas y diffs</text>
  <text x="62" y="469" class="note">Gestionar aprobaciones y trabajo paralelo</text>
  <text x="62" y="497" class="tiny">Ideal para: primer uso y tareas largas</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">Terminal</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">Flujos de línea de comandos y scripts</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Cerca de Git y comandos de prueba</text>
  <text x="354" y="469" class="note">Fácil registrar pasos repetibles</text>
  <text x="354" y="497" class="tiny">Ideal para: usuarios de terminal y automatización</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">Varios IDE</text>
  <text x="646" y="358" class="label">Integración IDE</text>
  <text x="646" y="389" class="note">Archivo y selección actuales</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">Preguntar con contexto del editor</text>
  <text x="646" y="469" class="note">Editar y revisar en el lugar</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">Ejecución remota</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">Repositorio remoto y entorno aislado</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">Delegación paralela y tareas más largas</text>
  <text x="938" y="469" class="note">Revisar resultados juntos al finalizar</text>
  <text x="938" y="497" class="tiny">Ideal para: trabajo remoto y asíncrono</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">Los puntos de entrada pueden pasarse el trabajo</text>
  <text x="600" y="640" text-anchor="middle" class="note">Aclarar localmente en IDE → pasar trabajo largo a App / Cloud → ejecutar comandos del equipo en CLI → volver a revisar el diff</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">Completa un ciclo real de lectura, edición, revisión de diff, verificación y decisiones de permisos.</text>
</svg>
