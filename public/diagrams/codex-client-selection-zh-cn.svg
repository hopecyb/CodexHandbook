<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Codex 客户端选择图</title>
  <desc id="desc">从工作主要发生的位置出发：本机任务控制台选择桌面 App，终端与脚本选择 CLI，当前文件与选区选择 IDE 集成，远程仓库与隔离环境选择 Cloud。四个入口可以接力使用，选择原则是离上下文近并且容易审查。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 30px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 16px; }
    .label { fill: #f8fafc; font-size: 20px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 15px; }
    .tiny { fill: #94a3b8; font-size: 13px; }
    .badge { fill: #020617; font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">先看工作发生在哪里，再选 Codex 入口</text>
  <text x="44" y="75" class="sub">不是能力排行榜，也不是四选一；优先选离当前上下文最近、最容易审查结果的入口。</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">这次工作主要发生在哪里？</text>
  <text x="600" y="171" text-anchor="middle" class="note">任务管理 · 终端 · 编辑器 · 远程仓库</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">默认起点</text>
  <text x="62" y="358" class="label">桌面 App</text>
  <text x="62" y="389" class="note">本机任务控制台</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">看任务与 diff</text>
  <text x="62" y="469" class="note">处理审批与并行工作</text>
  <text x="62" y="497" class="tiny">适合：第一次上手、长任务</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">终端</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">命令行与脚本流程</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">贴近 Git 与测试命令</text>
  <text x="354" y="469" class="note">便于记录可重复步骤</text>
  <text x="354" y="497" class="tiny">适合：终端用户、自动化</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">多种 IDE</text>
  <text x="646" y="358" class="label">IDE 集成</text>
  <text x="646" y="389" class="note">当前文件与选区</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">带着编辑器上下文提问</text>
  <text x="646" y="469" class="note">原地修改与审查</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">远程运行</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">远程仓库与隔离环境</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">并行委托与较长任务</text>
  <text x="938" y="469" class="note">完成后集中审查结果</text>
  <text x="938" y="497" class="tiny">适合：远程协作、异步工作</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">入口可以接力</text>
  <text x="600" y="640" text-anchor="middle" class="note">IDE 澄清局部 → App / Cloud 承接长任务 → CLI 跑团队命令 → 回到 diff 审查</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">选择后，用一次读取、修改、diff、验证和权限判断完成真实闭环。</text>
</svg>
