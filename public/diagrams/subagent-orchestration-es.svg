<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de orquestación de subagentes Codex</title>
  <desc id="desc">El Agent principal conserva objetivos, restricciones y permisos mientras delega trabajo acotado. Los subagentes heredan el sandbox y pueden compartir un workspace; devuelven evidencia para resolver conflictos, fusionar y verificar al final.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.8px; }
    .label { fill: #f8fafc; font-size: 15.2px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12px; }
    .tiny { fill: #94a3b8; font-size: 10.4px; }
    .lane { fill: #fbbf24; font-size: 11.2px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">El Agent principal orquesta, los subagentes se enfocan y la evidencia vuelve al hilo principal para aceptación</text>
  <text x="44" y="75" class="sub">Paraleliza primero el trabajo acotado de solo lectura. El aislamiento de contexto no es aislamiento de archivos; las tareas de escritura necesitan propiedad separada.</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">Agent principal: conservar control global</text>
  <text x="600" y="177" text-anchor="middle" class="note">Objetivo de usuario · restricciones · plan · modo de permisos</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">Definir contratos de subtarea, decidir si adoptar resultados y asumir la respuesta final</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">Contrato de delegación acotado</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">Subagente A</text>
  <text x="192" y="388" text-anchor="middle" class="note">Ruta de código de solo lectura</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">Entregar: cadena de llamadas y ubicaciones de archivos</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">Contexto independiente · permisos heredados</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">Puede ejecutarse con otras tareas de solo lectura</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">Subagente B</text>
  <text x="600" y="388" text-anchor="middle" class="note">Ubicar pruebas y reproducción</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">Entregar: comando fallido y registros</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">Contexto independiente · permisos heredados</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">Las conclusiones deben ser reproducibles</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">Subagente C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">Revisar opciones o cambios recientes</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">Entregar: opciones, evidencia y riesgos</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">Contexto independiente · permisos heredados</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">Añade coste de tokens y consolidación</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">Límite de ejecución compartido</text>
  <text x="600" y="566" text-anchor="middle" class="note">El sandbox y el modo de permisos se heredan de la tarea principal; varios Agents pueden ver un mismo workspace</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">Las escrituras concurrentes en un mismo archivo generan conflicto: asigna propiedad por directorio, componente o worktree, y luego fusiona en el hilo principal.</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">El Agent principal consolida, resuelve conflictos y verifica</text>
  <text x="600" y="721" text-anchor="middle" class="note">Comparar evidencia → decidir ediciones → fusionar → volver a ejecutar pruebas y build</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">Completar una subtarea no completa la tarea total; solo la evidencia reproducible sostiene la conclusión final.</text>
</svg>
