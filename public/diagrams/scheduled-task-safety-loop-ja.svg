<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Scheduled task の安全な実行ループ</title>
  <desc id="desc">永続的なタスクを定義して手動検証し、独立タスクかチャット内タスク、Web コンテキストかデスクトップのローカルプロジェクトと worktree を選びます。タスクは既定のサンドボックスで無人実行され、結果は Scheduled に入り人が確認します。問題があればプロンプト、ツール、頻度を調整し、変化がなければ終了し、高リスクな書き込みは人を待ちます。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.8px; }
    .label { fill: #f8fafc; font-size: 15.5px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12px; }
    .tiny { fill: #94a3b8; font-size: 10.3px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">手動検証から安全な定時実行へ</text>
  <text x="44" y="72" class="sub">スケジュールは再実行を起動するだけです。安定した入力、最小権限、停止条件、人による確認をタスクに明記します。</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. 永続的なタスクを定義</text>
  <text x="130" y="219" text-anchor="middle" class="note">入力 · 範囲 · 受け入れ条件</text>
  <text x="130" y="243" text-anchor="middle" class="note">変化なし · 失敗 · 停止</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">毎回行う内容を先に明記</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. 手動で検証</text>
  <text x="340" y="219" text-anchor="middle" class="note">同じプロンプト · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">同じツールと権限</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">結果をレビューできてからスケジュール</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. コンテキストを選択</text>
  <text x="550" y="219" text-anchor="middle" class="note">独立タスク：毎回再起動</text>
  <text x="550" y="243" text-anchor="middle" class="note">チャット内：コンテキストを継続</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">各実行が独立しているかで判断</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. 資料を選択</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web：アップロードとコネクタ</text>
  <text x="760" y="243" text-anchor="middle" class="note">デスクトップ：プロジェクト / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web からローカルディレクトリは読めない</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. 無人実行</text>
  <text x="970" y="219" text-anchor="middle" class="note">既定のサンドボックスを使用</text>
  <text x="970" y="243" text-anchor="middle" class="note">必要な権限だけ付与</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">ローカルタスクにはマシンと App の稼働が必要</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Scheduled 受信トレイ</text>
  <text x="680" y="390" text-anchor="middle" class="note">完了 · 失敗 · 要確認</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">実行証拠と未読状態を保持</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">人による確認</text>
  <text x="400" y="390" text-anchor="middle" class="note">証拠 · diff · 外部への副作用</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">重要な書き込みは引き続き人が判断</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">結果が広すぎる、資料不足、頻度が不適切：調整後に再度手動検証</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">各実行で 3 つの経路を明示</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">発見あり：証拠を提出 · 変化なし：簡潔に終了 · 完了不能：停止して人を待つ</text>
</svg>
