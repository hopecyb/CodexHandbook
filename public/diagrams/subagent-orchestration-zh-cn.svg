<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Codex 子 Agent 编排架构</title>
  <desc id="desc">主 Agent 持有全局目标、用户约束和权限模式，把边界清楚的只读探索、测试定位和方案核对委托给多个独立上下文。子 Agent 继承沙箱并可能共享工作区，返回结论与证据，由主 Agent 处理冲突、合并和最终验证。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 30px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 16px; }
    .label { fill: #f8fafc; font-size: 19px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 15px; }
    .tiny { fill: #94a3b8; font-size: 13px; }
    .lane { fill: #fbbf24; font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">主 Agent 编排，子 Agent 聚焦，证据回到主线程验收</text>
  <text x="44" y="75" class="sub">优先并行只读、边界清楚的工作；上下文隔离不代表文件隔离，写任务必须另划所有权。</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">主 Agent：保留全局控制</text>
  <text x="600" y="177" text-anchor="middle" class="note">用户目标 · 约束 · 计划 · 权限模式</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">定义子任务契约，决定是否采用结果，负责最终答复</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">有边界的委托契约</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">子 Agent A</text>
  <text x="192" y="388" text-anchor="middle" class="note">只读代码路径</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">交付：调用链与文件位置</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">独立上下文 · 继承权限</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">可与其他只读任务并行</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">子 Agent B</text>
  <text x="600" y="388" text-anchor="middle" class="note">定位测试与复现</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">交付：失败命令与日志</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">独立上下文 · 继承权限</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">结论必须可以复核</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">子 Agent C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">核对方案或近期变更</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">交付：选项、证据与风险</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">独立上下文 · 继承权限</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">增加 token 与汇总成本</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">共享执行边界</text>
  <text x="600" y="566" text-anchor="middle" class="note">沙箱与权限模式从主任务继承；多个 Agent 可能看到同一工作区</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">并行写同一文件会冲突：按目录 / 组件 / 工作树分配所有权，再由主线程合并。</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">主 Agent 汇总、处理冲突并验证</text>
  <text x="600" y="721" text-anchor="middle" class="note">比较证据 → 决定修改 → 合并 → 重跑测试与构建</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">子任务完成不是总任务完成；最终结论只由可复核证据支撑。</text>
</svg>
