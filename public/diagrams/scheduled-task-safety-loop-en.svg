<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Scheduled task safety loop</title>
  <desc id="desc">Define and verify a durable task, choose standalone/in-chat and Web/local context. Run unattended in the default sandbox, review in Scheduled, adjust errors, end on no change, and wait for a person before high-risk writes.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 22.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.2px; }
    .label { fill: #f8fafc; font-size: 13.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 10.6px; }
    .tiny { fill: #94a3b8; font-size: 9.1px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">From manual verification to safe scheduled execution</text>
  <text x="44" y="72" class="sub">Scheduling only retriggers the task; stable inputs, least privilege, stop conditions, and human review must be written into it.</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. Define a durable task</text>
  <text x="130" y="219" text-anchor="middle" class="note">Input · scope · acceptance</text>
  <text x="130" y="243" text-anchor="middle" class="note">No change · failure · stop</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">First state what every run must do</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. Verify manually</text>
  <text x="340" y="219" text-anchor="middle" class="note">Same prompt · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">Same tools and permissions</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">Schedule only after manual review</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. Choose context</text>
  <text x="550" y="219" text-anchor="middle" class="note">Standalone task: restart every run</text>
  <text x="550" y="243" text-anchor="middle" class="note">In-chat task: retain context</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">Choose by whether runs are independent</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. Choose material</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web: uploads and connected tools</text>
  <text x="760" y="243" text-anchor="middle" class="note">Desktop: project / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web cannot read local directories</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. Run unattended</text>
  <text x="970" y="219" text-anchor="middle" class="note">Use the default sandbox</text>
  <text x="970" y="243" text-anchor="middle" class="note">Grant only required permissions</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">Local tasks require computer + App online</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Scheduled inbox</text>
  <text x="680" y="390" text-anchor="middle" class="note">Complete · failed · needs attention</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">Preserve run evidence and unread state</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">Human review</text>
  <text x="400" y="390" text-anchor="middle" class="note">Evidence · diff · external side effects</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">People still decide critical writes</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">If results are too broad, material is missing, or frequency is wrong: adjust and verify manually again</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">Every run must define three paths</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">Finding: deliver evidence · no change: end briefly · unable: stop and wait for a person</text>
</svg>
