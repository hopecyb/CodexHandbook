<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Flujo verificado de corrección de bugs</title>
  <desc id="desc">Reproduce un rojo estable y registra evidencia; ubica la causa raíz, aplica la reparación mínima, alcanza verde en pruebas relacionadas y luego ejecuta regresión completa y revisión de diff. Los fallos vuelven al paso correspondiente.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.8px; }
    .label { fill: #f8fafc; font-size: 13.6px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.2px; }
    .tiny { fill: #94a3b8; font-size: 9.6px; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="590" rx="8" fill="#020617"/>
  <rect width="1100" height="590" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Corrección verificada: rojo, luego verde, luego regresión</text>
  <text x="44" y="70" class="sub">Una prueba que pasa solo se vuelve evidencia de reparación después de reproducir de forma fiable el problema original.</text>

  <path d="M186 260H226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M374 260H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M562 260H602" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 260H790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M938 260H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M864 320V410H488V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M676 320V456H300V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="38" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="112" y="235" text-anchor="middle" class="label">1. Reproducir de forma fiable</text>
  <text x="112" y="261" text-anchor="middle" class="note">Ejecutar la prueba fallida</text>
  <text x="112" y="283" text-anchor="middle" class="note">Guardar aserción y stack</text>
  <text x="112" y="304" text-anchor="middle" class="tiny" fill="#fb7185">ROJO · fallo esperado</text>

  <rect x="226" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" class="label">2. Ubicar causa raíz</text>
  <text x="300" y="261" text-anchor="middle" class="note">Leer implementación y pruebas</text>
  <text x="300" y="283" text-anchor="middle" class="note">Eliminar hipótesis cercanas</text>
  <text x="300" y="304" text-anchor="middle" class="tiny">Explicar primero; no editar</text>

  <rect x="414" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="488" y="235" text-anchor="middle" class="label">3. Reparación mínima</text>
  <text x="488" y="261" text-anchor="middle" class="note">Cambiar solo la ruta de causa raíz</text>
  <text x="488" y="283" text-anchor="middle" class="note">Conservar comportamiento público</text>
  <text x="488" y="304" text-anchor="middle" class="tiny">Rechazar refactorización incidental</text>

  <rect x="602" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="676" y="235" text-anchor="middle" class="label">4. Pruebas relacionadas</text>
  <text x="676" y="261" text-anchor="middle" class="note">La prueba original pasa a verde</text>
  <text x="676" y="283" text-anchor="middle" class="note">Las pruebas de borde pasan</text>
  <text x="676" y="304" text-anchor="middle" class="tiny" fill="#34d399">GREEN</text>

  <rect x="790" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="864" y="235" text-anchor="middle" class="label">5. Regresión y revisión</text>
  <text x="864" y="261" text-anchor="middle" class="note">Pruebas completas · lint</text>
  <text x="864" y="283" text-anchor="middle" class="note">Revisión de diff y alcance</text>
  <text x="864" y="304" text-anchor="middle" class="tiny">Registrar riesgos residuales</text>

  <rect x="974" y="218" width="94" height="84" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1021" y="250" text-anchor="middle" class="label">Entregar</text>
  <text x="1021" y="275" text-anchor="middle" class="note">Evidencia completa</text>

  <rect x="154" y="478" width="792" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="504" text-anchor="middle" class="note">Cadena de evidencia: comando y aserción fallidos → explicación de causa raíz → diff mínimo → pruebas relacionadas pasan → regresión completa pasa → revisión humana del alcance</text>
  <text x="550" y="526" text-anchor="middle" class="tiny">El fallo en pruebas relacionadas vuelve a la reparación mínima; el fallo en regresión completa o revisión de diff vuelve al análisis de causa raíz.</text>
</svg>
