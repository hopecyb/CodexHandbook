<svg lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">AI 애플리케이션 엔지니어링 로드맵</title>
  <desc id="desc">최신순 세로 타임라인: Harness Engineering, Skills, 컨텍스트 엔지니어링, 다중 에이전트 협업, 도구 사용, MCP, 함수 호출, 프롬프트 엔지니어링에서 RAG까지 거슬러 올라갑니다. 날짜는 해당 논문, 발표, 글의 공개일만 뜻합니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .title { fill: #111827; font-size: 27.5px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13.8px; }
    .year { fill: #2563eb; font-size: 15.5px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 15.5px; font-weight: 700; }
    .node-date { fill: #6b7280; font-size: 11.2px; }
    .node-body { fill: #374151; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" fill="#ffffff"/>
  <rect x="42" y="34" width="816" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="86" class="title">AI 애플리케이션 엔지니어링 로드맵</text>
  <text x="72" y="122" class="subtitle">최신순. 날짜는 표에 나온 논문·발표·글 기준이며 개념의 탄생일이 아닙니다.</text>
  <text x="72" y="148" class="subtitle">위에서 아래로: 실행 환경과 재사용 → 협업 → 도구 프로토콜 → 입력 제어 → 지식 근거.</text>

  <line x1="224" y1="218" x2="224" y2="1398" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-main)"/>

  <g transform="translate(70 1325)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2020</text>
  </g>
  <g transform="translate(70 1179)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2022</text>
  </g>
  <g transform="translate(70 1033)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2023</text>
  </g>
  <g transform="translate(70 887)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2024</text>
  </g>
  <g transform="translate(70 558)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2025</text>
  </g>
  <g transform="translate(70 229)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2026</text>
  </g>
  <g transform="translate(240 202)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#dc2626"/>
    <text x="28" y="32" class="node-title">Harness Engineering(실행 하네스 엔지니어링)</text>
    <text x="28" y="55" class="node-date">2026-02-11 · 검증 가능한 실행 환경</text>
    <text x="28" y="78" class="node-body">도구, 컨텍스트, 피드백, 복구, 품질 게이트를 안정적인 작업 발판으로 묶습니다.</text>
  </g>
  <g transform="translate(240 348)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Skills(스킬)</text>
    <text x="28" y="55" class="node-date">2025-10-16 · 재사용 가능한 워크플로 단위</text>
    <text x="28" y="78" class="node-body">프롬프트, 단계, 예시, 스크립트, 리소스를 묶어 AI가 경험을 안정적으로 재사용합니다.</text>
  </g>
  <g transform="translate(240 470)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Context Engineering(컨텍스트 엔지니어링)</text>
    <text x="28" y="55" class="node-date">2025-09-29 · 컨텍스트 설계</text>
    <text x="28" y="78" class="node-body">“좋은 프롬프트 쓰기”에서 “모델이 무엇을 어떤 우선순위로 볼지 설계”로.</text>
  </g>
  <g transform="translate(240 592)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Multi-agent(다중 에이전트 협업)</text>
    <text x="28" y="55" class="node-date">2025-06-13 · 역할 기반 협업</text>
    <text x="28" y="78" class="node-body">조사, 구현, 리뷰, 검증을 역할별로 나눠 복잡한 작업을 병렬로 진행합니다.</text>
  </g>
  <g transform="translate(240 714)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#0d9488"/>
    <text x="28" y="32" class="node-title">Tool Use(도구 사용)</text>
    <text x="28" y="55" class="node-date">2025-03-11 · 다중 도구 실행</text>
    <text x="28" y="78" class="node-body">모델이 작업 중 도구를 골라 호출하고, 결과를 읽은 뒤 다음 추론을 이어 갑니다.</text>
  </g>
  <g transform="translate(240 860)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#9333ea"/>
    <text x="28" y="32" class="node-title">MCP(모델 컨텍스트 프로토콜)</text>
    <text x="28" y="55" class="node-date">2024-11-25 · 도구 프로토콜</text>
    <text x="28" y="78" class="node-body">도구, 리소스, 프롬프트, 컨텍스트를 프로토콜로 노출해 일회성 통합을 줄입니다.</text>
  </g>
  <g transform="translate(240 1006)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Function Calling(함수 호출)</text>
    <text x="28" y="55" class="node-date">2023-06-13 · 구조화된 동작</text>
    <text x="28" y="78" class="node-body">텍스트 생성을 넘어 파싱 가능한 인자로 함수, API, 업무 동작을 호출합니다.</text>
  </g>
  <g transform="translate(240 1152)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Prompt Engineering(프롬프트 엔지니어링)</text>
    <text x="28" y="55" class="node-date">2022-11-30 · 입력 제어</text>
    <text x="28" y="78" class="node-body">작업 설명, 예시, 형식 제약으로 모델을 쓸모 있는 출력으로 이끕니다.</text>
  </g>
  <g transform="translate(240 1298)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#f97316"/>
    <text x="28" y="32" class="node-title">RAG(검색 증강 생성)</text>
    <text x="28" y="55" class="node-date">2020-05-22 · 지식 근거 연결</text>
    <text x="28" y="78" class="node-body">외부 자료를 검색해 컨텍스트에 넣어 환각을 줄이고 답을 출처에 연결합니다.</text>
  </g>
</svg>
