<svg lang="pt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo da especificação da tarefa ao resultado verificável</title>
  <desc id="desc">Objetivo, contexto, entradas, restrições, aceitação e permissões formam a tarefa. Codex explora, planeja, executa e verifica; falha retorna com evidências e sucesso entrega.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.8px; }
    .label { fill: #f8fafc; font-size: 14.4px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.2px; }
    .tiny { fill: #94a3b8; font-size: 9.6px; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1000" height="560" rx="8" fill="#020617"/>
  <rect width="1000" height="560" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Da especificação da tarefa ao resultado verificável</text>
  <text x="44" y="70" class="sub">Um bom prompt não é o ponto final; ele conecta execução, evidências e feedback em um ciclo.</text>

  <path d="M260 282H310" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M438 282H478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M606 282H646" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M774 282H814" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M878 336V406H770" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M846 336V454H170V378" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="40" y="112" width="220" height="266" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="142" text-anchor="middle" class="label">Especificação da tarefa</text>
  <text x="115" y="177" text-anchor="end" class="note">Objetivo</text><text x="125" y="177" class="tiny">Entregável final</text>
  <text x="115" y="207" text-anchor="end" class="note">Contexto</text><text x="125" y="207" class="tiny">Por que importa</text>
  <text x="115" y="237" text-anchor="end" class="note">Entradas</text><text x="125" y="237" class="tiny">Material obrigatório</text>
  <text x="115" y="267" text-anchor="end" class="note">Restrições</text><text x="125" y="267" class="tiny">Escopo e proibições</text>
  <text x="115" y="297" text-anchor="end" class="note">Aceitação</text><text x="125" y="297" class="tiny">Evidência observável</text>
  <text x="115" y="327" text-anchor="end" class="note">Permissões</text><text x="125" y="327" class="tiny">Rede · escritas · aprovações</text>
  <line x1="62" y1="344" x2="228" y2="344" stroke="#1e293b"/>
  <text x="145" y="364" text-anchor="middle" class="tiny">Pergunte quando faltar informação; não adivinhe</text>

  <rect x="310" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="374" y="266" text-anchor="middle" class="label">Explorar</text>
  <text x="374" y="291" text-anchor="middle" class="note">Estado atual · escopo</text>
  <text x="374" y="311" text-anchor="middle" class="note">Riscos · desconhecidos</text>

  <rect x="478" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="542" y="266" text-anchor="middle" class="label">Plano</text>
  <text x="542" y="291" text-anchor="middle" class="note">Etapas · arquivos</text>
  <text x="542" y="311" text-anchor="middle" class="note">Riscos · verificação</text>

  <rect x="646" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="266" text-anchor="middle" class="label">Executar</text>
  <text x="710" y="291" text-anchor="middle" class="note">Pequenas edições</text>
  <text x="710" y="311" text-anchor="middle" class="note">Controlar escopo</text>

  <rect x="814" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="878" y="266" text-anchor="middle" class="label">Verificar</text>
  <text x="878" y="291" text-anchor="middle" class="note">Testes · diff</text>
  <text x="878" y="311" text-anchor="middle" class="note">Capturas · fontes</text>

  <rect x="490" y="382" width="280" height="62" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="408" text-anchor="middle" class="label">Passou: entregar um resultado verificável</text>
  <text x="630" y="429" text-anchor="middle" class="tiny">Artefato + evidência + riscos residuais</text>
  <text x="905" y="393" class="tiny" fill="#34d399">Passou</text>
  <text x="460" y="472" class="tiny" fill="#fb7185">Falha: retornar à tarefa ou ao plano com evidência da falha</text>
</svg>
