<svg lang="pt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo seguro de Scheduled task</title>
  <desc id="desc">Defina e verifique uma tarefa durável, escolha contexto independente/no chat e Web/local. Rode sem supervisão no sandbox padrão, revise em Scheduled, ajuste erros, encerre se não houver mudança e espere uma pessoa antes de escritas de alto risco.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 21px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 11.2px; }
    .label { fill: #f8fafc; font-size: 12.6px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 9.8px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Da verificação manual à execução agendada segura</text>
  <text x="44" y="72" class="sub">O agendamento apenas dispara novamente a tarefa; entradas estáveis, privilégio mínimo, condições de parada e revisão humana devem estar escritos nela.</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. Definir uma tarefa durável</text>
  <text x="130" y="219" text-anchor="middle" class="note">Entrada · escopo · aceitação</text>
  <text x="130" y="243" text-anchor="middle" class="note">Sem mudança · falha · parar</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">Primeiro diga o que cada execução deve fazer</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. Verificar manualmente</text>
  <text x="340" y="219" text-anchor="middle" class="note">Mesmo prompt · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">Mesmas ferramentas e permissões</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">Agendar somente após revisão manual</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. Escolher contexto</text>
  <text x="550" y="219" text-anchor="middle" class="note">Tarefa independente: reiniciar a cada execução</text>
  <text x="550" y="243" text-anchor="middle" class="note">Tarefa no chat: reter contexto</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">Escolha conforme as execuções sejam independentes</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. Escolher material</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web: uploads e ferramentas conectadas</text>
  <text x="760" y="243" text-anchor="middle" class="note">Desktop: projeto / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web não pode ler diretórios locais</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. Executar sem supervisão</text>
  <text x="970" y="219" text-anchor="middle" class="note">Usar o sandbox padrão</text>
  <text x="970" y="243" text-anchor="middle" class="note">Conceder apenas permissões necessárias</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">Tarefas locais exigem computador + App online</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Caixa Scheduled</text>
  <text x="680" y="390" text-anchor="middle" class="note">Concluído · falhou · precisa de atenção</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">Preservar evidências de execução e estado não lido</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">Revisão humana</text>
  <text x="400" y="390" text-anchor="middle" class="note">Evidências · diff · efeitos externos</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">Pessoas ainda decidem escritas críticas</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">Se os resultados forem amplos demais, faltar material ou a frequência estiver inadequada: ajuste e verifique manualmente de novo</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">Cada execução deve definir três caminhos</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">Achado: entregar evidências · sem mudança: encerrar brevemente · impossível: parar e esperar uma pessoa</text>
</svg>
