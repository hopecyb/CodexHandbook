<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Codex のサンドボックスと承認判断フロー</title>
  <desc id="desc">Codex がタスクのために動作を提案し、まずサンドボックス内か判断します。範囲内なら実行して証拠を残し、範囲外なら承認ポリシーに従って人に判断を求めます。拒否時は範囲を狭めるか理由を説明し、承認時は明示された動作だけを実行します。どちらも最後に結果を検証します。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 26.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 14.1px; }
    .label { fill: #f8fafc; font-size: 16.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 13.2px; }
    .tiny { fill: #94a3b8; font-size: 11.4px; }
    .edge { fill: #e2e8f0; font-size: 11.4px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="780" rx="8" fill="#020617"/>
  <rect width="1200" height="780" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">サンドボックスは「どこまで可能か」、承認は「越境前に確認するか」を制御</text>
  <text x="44" y="75" class="sub">タスク制約が意図を示し、システム境界が実行を制限し、diff、テスト、外部状態で最終確認します。</text>

  <rect x="66" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="191" y="158" text-anchor="middle" class="label">タスクの目標と制約</text>
  <text x="191" y="186" text-anchor="middle" class="note">許可範囲 · 禁止操作 · 受け入れ条件</text>
  <path d="M316 169H390" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="515" y="158" text-anchor="middle" class="label">Codex が動作を提案</text>
  <text x="515" y="186" text-anchor="middle" class="note">読み書き · コマンド · ネットワーク · アプリ</text>
  <path d="M640 169H714" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M850 112L986 169L850 226L714 169Z" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="850" y="160" text-anchor="middle" class="label">現在のサンドボックス</text>
  <text x="850" y="185" text-anchor="middle" class="label">範囲内？</text>

  <path d="M986 169H1080V298" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="1015" y="155" class="edge">はい</text>
  <rect x="950" y="298" width="230" height="98" rx="9" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1065" y="335" text-anchor="middle" class="label">境界内で実行</text>
  <text x="1065" y="364" text-anchor="middle" class="note">コマンドと出力は引き続き記録</text>

  <path d="M850 226V282H588" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="864" y="258" class="edge">いいえ</text>
  <rect x="318" y="282" width="270" height="104" rx="9" fill="#07101f" stroke="#fb7185" stroke-width="1.5"/>
  <text x="453" y="319" text-anchor="middle" class="label">承認ポリシーの処理は？</text>
  <text x="453" y="348" text-anchor="middle" class="note">ユーザーに確認、またはポリシーで拒否</text>
  <text x="453" y="371" text-anchor="middle" class="tiny">子プロセスにも同じサンドボックス制約</text>

  <path d="M385 386V445H214" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="314" y="430" class="edge">拒否</text>
  <rect x="48" y="445" width="332" height="122" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5"/>
  <text x="214" y="483" text-anchor="middle" class="label">動作を狭めるか、ブロック理由を説明</text>
  <text x="214" y="513" text-anchor="middle" class="note">ワークスペース内のパス · 既存依存関係を使用</text>
  <text x="214" y="541" text-anchor="middle" class="tiny">より高リスクな代替操作へ黙って切り替えない</text>

  <path d="M521 386V445H684" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="574" y="430" class="edge">承認</text>
  <rect x="518" y="445" width="332" height="122" rx="9" fill="#2a240b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="684" y="483" text-anchor="middle" class="label">明示的に承認された範囲だけ実行</text>
  <text x="684" y="513" text-anchor="middle" class="note">具体的なコマンド · パス · ドメイン · 期間</text>
  <text x="684" y="541" text-anchor="middle" class="tiny">新たな越境操作は再判断が必要</text>

  <path d="M214 567V637H516" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M684 567V637H638" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1065 396V637H638" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#green-arrow)"/>
  <rect x="390" y="618" width="420" height="108" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="658" text-anchor="middle" class="label">結果と外部への副作用を検証</text>
  <text x="600" y="687" text-anchor="middle" class="note">diff · テスト · ログ · リモート状態 · 回復可能性</text>
  <text x="600" y="712" text-anchor="middle" class="tiny">確認画面がないことはレビュー不要という意味ではなく、承認済みでも結果が正しいとは限りません。</text>
</svg>
