<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Architektur eines wiederverwendbaren Codex-Arbeitssystems</title>
  <desc id="desc">Aufgaben-Prompts und Projektregeln fließen in eine Codex-Aufgabe ein; Skills liefern Abläufe, MCP externe Werkzeuge, Unter-Agents parallele Erkundung und Hooks Schutz an Lebenszykluspunkten. Plugin verteilt Funktionen, Scheduled task löst zeitgesteuert aus, Menschen prüfen das Endergebnis.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 22.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.2px; }
    .label { fill: #f8fafc; font-size: 13.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 10.6px; }
    .tiny { fill: #94a3b8; font-size: 9.1px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="720" rx="8" fill="#020617"/>
  <rect width="1200" height="720" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Wiederverwendbares Codex-Arbeitssystem</text>
  <text x="44" y="70" class="sub">Regeln, Abläufe, Werkzeuge, Schutz, Verteilung und Auslöser arbeiten für eine Aufgabe zusammen; sie sind keine austauschbaren Stufen.</text>

  <path d="M222 191H350" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 301H350" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 411H350" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 521H350" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 276H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 420H974" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M1068 310V382" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1068 480V540H730" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="42" y="145" width="180" height="92" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="178" text-anchor="middle" class="label">Aufgaben-Prompt</text>
  <text x="132" y="202" text-anchor="middle" class="note">Ziel · Eingabe · Abnahme</text>
  <text x="132" y="221" text-anchor="middle" class="tiny">Konkrete Anforderungen dieser Aufgabe</text>

  <rect x="42" y="255" width="180" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="132" y="288" text-anchor="middle" class="label">AGENTS.md</text>
  <text x="132" y="312" text-anchor="middle" class="note">Projektregeln · Befehle</text>
  <text x="132" y="331" text-anchor="middle" class="tiny">Bei jeder Aufgabe geladen</text>

  <rect x="42" y="365" width="180" height="92" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="132" y="398" text-anchor="middle" class="label">Skill</text>
  <text x="132" y="422" text-anchor="middle" class="note">Ablauf · Referenzen · Skripte</text>
  <text x="132" y="441" text-anchor="middle" class="tiny">Bei Bedarf geladen</text>

  <rect x="42" y="475" width="180" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="132" y="503" text-anchor="middle" class="label">Scheduled task</text>
  <text x="132" y="527" text-anchor="middle" class="note">Scheduled task</text>
  <text x="132" y="550" text-anchor="middle" class="tiny">Neuen Lauf zeitgesteuert auslösen</text>

  <rect x="350" y="112" width="470" height="486" rx="12" fill="#07101f" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="370" y="140" class="note" fill="#fbbf24">Ein Codex-Aufgabenlauf</text>
  <rect x="390" y="175" width="390" height="84" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="585" y="207" text-anchor="middle" class="label">Haupt-Agent</text>
  <text x="585" y="232" text-anchor="middle" class="note">Ziel verstehen · Plan pflegen · Nachweise bündeln</text>

  <rect x="390" y="299" width="170" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="475" y="332" text-anchor="middle" class="label">Unter-Agent</text>
  <text x="475" y="356" text-anchor="middle" class="note">Unabhängige Erkundung und Prüfung</text>
  <text x="475" y="376" text-anchor="middle" class="tiny">Ergebnisse an den Hauptthread zurückgeben</text>
  <rect x="610" y="299" width="170" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="332" text-anchor="middle" class="label">MCP / Werkzeuge</text>
  <text x="695" y="356" text-anchor="middle" class="note">Dateien · Web · externe Systeme</text>
  <text x="695" y="376" text-anchor="middle" class="tiny">Berechtigungen durch Host und Dienst gesteuert</text>
  <path d="M585 259V278H475V297" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M585 259V278H695V297" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="390" y="435" width="390" height="114" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="585" y="468" text-anchor="middle" class="label">Hooks: Leitplanken im Lebenszyklus</text>
  <text x="585" y="495" text-anchor="middle" class="note">Vorabprüfung · Werkzeugrichtlinie · Nachaudit</text>
  <text x="585" y="520" text-anchor="middle" class="tiny">Kann protokollieren, Kontext ergänzen oder blockieren; definiert keine Aufgabenziele</text>

  <rect x="974" y="232" width="184" height="78" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="1066" y="263" text-anchor="middle" class="label">Prüfbare Artefakte</text>
  <text x="1066" y="287" text-anchor="middle" class="note">Dateien · diff · Berichte · Nachweise</text>
  <rect x="974" y="382" width="184" height="98" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1066" y="414" text-anchor="middle" class="label">Menschliche Prüfung</text>
  <text x="1066" y="438" text-anchor="middle" class="note">Umfang · Korrektheit · Risiko</text>
  <text x="1066" y="459" text-anchor="middle" class="tiny">Bei Fehler mit Nachweisen zurückgeben</text>

  <rect x="350" y="626" width="808" height="64" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="754" y="652" text-anchor="middle" class="note">Plugin: Skills, Konnektoren, MCP, Hooks und Aufgabenvorlagen bündeln, installieren und verteilen</text>
  <text x="754" y="676" text-anchor="middle" class="tiny">Teil der Verteilungsebene, nicht letzter Schritt der Ausführungskette</text>
</svg>
