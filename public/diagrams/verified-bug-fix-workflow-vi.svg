<svg lang="vi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Quy trình sửa Bug có xác minh</title>
  <desc id="desc">Trước hết chạy kiểm thử để tái hiện ổn định trạng thái đỏ và lưu bằng chứng thất bại; sau đó định vị nguyên nhân gốc, sửa tối thiểu, chạy kiểm thử liên quan đến trạng thái xanh, rồi chạy hồi quy đầy đủ và rà soát diff. Thất bại ở bước nào thì quay lại bước tương ứng.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24.6px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.1px; }
    .label { fill: #f8fafc; font-size: 13.9px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.5px; }
    .tiny { fill: #94a3b8; font-size: 9.8px; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="590" rx="8" fill="#020617"/>
  <rect width="1100" height="590" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Sửa Bug có xác minh: đỏ trước, xanh sau, rồi hồi quy</text>
  <text x="44" y="70" class="sub">Kiểm thử vượt qua chỉ là bằng chứng sửa lỗi khi vấn đề gốc đã được tái hiện ổn định trước đó.</text>

  <path d="M186 260H226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M374 260H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M562 260H602" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 260H790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M938 260H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M864 320V410H488V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M676 320V456H300V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="38" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="112" y="235" text-anchor="middle" class="label">1. Tái hiện ổn định</text>
  <text x="112" y="261" text-anchor="middle" class="note">Chạy kiểm thử thất bại</text>
  <text x="112" y="283" text-anchor="middle" class="note">Lưu assertion và stack</text>
  <text x="112" y="304" text-anchor="middle" class="tiny" fill="#fb7185">RED · thất bại như dự kiến</text>

  <rect x="226" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" class="label">2. Định vị nguyên nhân gốc</text>
  <text x="300" y="261" text-anchor="middle" class="note">Đọc phần triển khai và kiểm thử</text>
  <text x="300" y="283" text-anchor="middle" class="note">Loại trừ giả thuyết lân cận</text>
  <text x="300" y="304" text-anchor="middle" class="tiny">Giải thích trước, chưa sửa mã</text>

  <rect x="414" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="488" y="235" text-anchor="middle" class="label">3. Sửa tối thiểu</text>
  <text x="488" y="261" text-anchor="middle" class="note">Chỉ sửa đường dẫn nguyên nhân gốc</text>
  <text x="488" y="283" text-anchor="middle" class="note">Giữ hành vi công khai</text>
  <text x="488" y="304" text-anchor="middle" class="tiny">Không tiện tay tái cấu trúc</text>

  <rect x="602" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="676" y="235" text-anchor="middle" class="label">4. Kiểm thử liên quan</text>
  <text x="676" y="261" text-anchor="middle" class="note">Kiểm thử gốc chuyển xanh</text>
  <text x="676" y="283" text-anchor="middle" class="note">Kiểm thử biên vượt qua</text>
  <text x="676" y="304" text-anchor="middle" class="tiny" fill="#34d399">GREEN</text>

  <rect x="790" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="864" y="235" text-anchor="middle" class="label">5. Hồi quy và rà soát</text>
  <text x="864" y="261" text-anchor="middle" class="note">Toàn bộ kiểm thử · lint</text>
  <text x="864" y="283" text-anchor="middle" class="note">Kiểm tra diff và phạm vi</text>
  <text x="864" y="304" text-anchor="middle" class="tiny">Ghi lại rủi ro còn lại</text>

  <rect x="974" y="218" width="94" height="84" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1021" y="250" text-anchor="middle" class="label">Bàn giao</text>
  <text x="1021" y="275" text-anchor="middle" class="note">Đủ bằng chứng</text>

  <rect x="154" y="478" width="792" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="504" text-anchor="middle" class="note">Chuỗi bằng chứng: lệnh và assertion thất bại → giải thích nguyên nhân gốc → diff tối thiểu → kiểm thử liên quan vượt qua → hồi quy đầy đủ vượt qua → con người rà soát phạm vi</text>
  <text x="550" y="526" text-anchor="middle" class="tiny">Nếu kiểm thử liên quan thất bại, quay lại sửa tối thiểu; nếu hồi quy đầy đủ hoặc rà soát diff thất bại, quay lại phân tích nguyên nhân gốc.</text>
</svg>
