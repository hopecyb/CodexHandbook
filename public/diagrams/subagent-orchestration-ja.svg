<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Codex 子 Agent のオーケストレーション構成</title>
  <desc id="desc">主 Agent が全体目標、ユーザー制約、権限モードを保持し、境界の明確な読み取り専用探索、テスト特定、案の確認を複数の独立コンテキストに委任します。子 Agent はサンドボックスを継承し、ワークスペースを共有する場合があります。結論と証拠を返し、主 Agent が競合、統合、最終検証を処理します。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 26.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 14.1px; }
    .label { fill: #f8fafc; font-size: 16.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 13.2px; }
    .tiny { fill: #94a3b8; font-size: 11.4px; }
    .lane { fill: #fbbf24; font-size: 12.3px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">主 Agent が編成し、子 Agent が集中し、証拠を主スレッドで検収</text>
  <text x="44" y="75" class="sub">境界が明確な読み取り専用作業を優先して並列化します。コンテキストの分離はファイルの分離ではないため、書き込みタスクには別々の所有範囲が必要です。</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">主 Agent：全体制御を維持</text>
  <text x="600" y="177" text-anchor="middle" class="note">ユーザー目標 · 制約 · 計画 · 権限モード</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">子タスク契約を定義し、結果の採否を決め、最終回答を担当</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">境界付きの委任契約</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">子 Agent A</text>
  <text x="192" y="388" text-anchor="middle" class="note">コードパスを読み取り専用で調査</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">成果：呼び出しチェーンとファイル位置</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">独立コンテキスト · 権限を継承</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">他の読み取り専用タスクと並列化可能</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">子 Agent B</text>
  <text x="600" y="388" text-anchor="middle" class="note">テストを特定して再現</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">成果：失敗コマンドとログ</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">独立コンテキスト · 権限を継承</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">結論は再確認可能であること</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">子 Agent C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">案または最近の変更を確認</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">成果：選択肢、証拠、リスク</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">独立コンテキスト · 権限を継承</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">token と集約のコストが増える</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">共有実行境界</text>
  <text x="600" y="566" text-anchor="middle" class="note">サンドボックスと権限モードは主タスクから継承。複数の Agent が同じワークスペースを見る場合がある</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">同じファイルへの並列書き込みは競合します。ディレクトリ / コンポーネント / worktree ごとに所有権を割り当て、主スレッドで統合します。</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">主 Agent が集約、競合処理、検証</text>
  <text x="600" y="721" text-anchor="middle" class="note">証拠を比較 → 変更を決定 → 統合 → テストとビルドを再実行</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">子タスクの完了は全体タスクの完了ではありません。最終結論は再確認可能な証拠だけで裏付けます。</text>
</svg>
