<svg lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Codex 재사용 가능 작업 시스템 아키텍처</title>
  <desc id="desc">작업 프롬프트와 프로젝트 규칙이 Codex 작업에 들어갑니다. Skills는 흐름, MCP는 외부 도구, 하위 Agent는 병렬 탐색, Hooks는 수명 주기 지점의 보호를 제공합니다. Plugin은 기능을 배포하고 Scheduled task는 정기 실행을 시작하며, 최종 출력은 사람이 검토합니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.8px; }
    .label { fill: #f8fafc; font-size: 15.5px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12px; }
    .tiny { fill: #94a3b8; font-size: 10.3px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="720" rx="8" fill="#020617"/>
  <rect width="1200" height="720" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Codex 재사용 가능 작업 시스템</text>
  <text x="44" y="70" class="sub">규칙, 흐름, 도구, 보호, 배포, 트리거가 하나의 작업을 중심으로 협력합니다. 서로를 대체하는 단계가 아닙니다.</text>

  <path d="M222 191H350" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 301H350" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 411H350" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 521H350" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 276H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 420H974" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M1068 310V382" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1068 480V540H730" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="42" y="145" width="180" height="92" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="178" text-anchor="middle" class="label">작업 프롬프트</text>
  <text x="132" y="202" text-anchor="middle" class="note">목표 · 입력 · 인수 조건</text>
  <text x="132" y="221" text-anchor="middle" class="tiny">현재 작업의 구체적 요구 사항</text>

  <rect x="42" y="255" width="180" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="132" y="288" text-anchor="middle" class="label">AGENTS.md</text>
  <text x="132" y="312" text-anchor="middle" class="note">프로젝트 규칙 · 명령</text>
  <text x="132" y="331" text-anchor="middle" class="tiny">모든 작업에서 로드</text>

  <rect x="42" y="365" width="180" height="92" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="132" y="398" text-anchor="middle" class="label">Skill</text>
  <text x="132" y="422" text-anchor="middle" class="note">흐름 · 참고 자료 · 스크립트</text>
  <text x="132" y="441" text-anchor="middle" class="tiny">작업에 필요할 때 로드</text>

  <rect x="42" y="475" width="180" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="132" y="503" text-anchor="middle" class="label">예약 작업</text>
  <text x="132" y="527" text-anchor="middle" class="note">Scheduled task</text>
  <text x="132" y="550" text-anchor="middle" class="tiny">정해진 시간에 새 실행 시작</text>

  <rect x="350" y="112" width="470" height="486" rx="12" fill="#07101f" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="370" y="140" class="note" fill="#fbbf24">Codex 작업 1회 실행</text>
  <rect x="390" y="175" width="390" height="84" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="585" y="207" text-anchor="middle" class="label">주 Agent</text>
  <text x="585" y="232" text-anchor="middle" class="note">목표 이해 · 계획 유지 · 증거 취합</text>

  <rect x="390" y="299" width="170" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="475" y="332" text-anchor="middle" class="label">하위 Agent</text>
  <text x="475" y="356" text-anchor="middle" class="note">독립 탐색과 검사</text>
  <text x="475" y="376" text-anchor="middle" class="tiny">결과를 주 스레드로 반환</text>
  <rect x="610" y="299" width="170" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="332" text-anchor="middle" class="label">MCP / 도구</text>
  <text x="695" y="356" text-anchor="middle" class="note">파일 · Web · 외부 시스템</text>
  <text x="695" y="376" text-anchor="middle" class="tiny">호스트와 서비스가 권한 제어</text>
  <path d="M585 259V278H475V297" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M585 259V278H695V297" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="390" y="435" width="390" height="114" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="585" y="468" text-anchor="middle" class="label">Hooks: 수명 주기 가드레일</text>
  <text x="585" y="495" text-anchor="middle" class="note">실행 전 검사 · 도구 호출 정책 · 실행 후 감사</text>
  <text x="585" y="520" text-anchor="middle" class="tiny">기록, 컨텍스트 추가, 차단 가능. 작업 목표는 정의하지 않음</text>

  <rect x="974" y="232" width="184" height="78" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="1066" y="263" text-anchor="middle" class="label">검토 가능한 결과물</text>
  <text x="1066" y="287" text-anchor="middle" class="note">파일 · diff · 보고서 · 증거</text>
  <rect x="974" y="382" width="184" height="98" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1066" y="414" text-anchor="middle" class="label">사람의 검토</text>
  <text x="1066" y="438" text-anchor="middle" class="note">범위 · 정확성 · 위험</text>
  <text x="1066" y="459" text-anchor="middle" class="tiny">실패하면 증거와 함께 반환</text>

  <rect x="350" y="626" width="808" height="64" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="754" y="652" text-anchor="middle" class="note">Plugin: Skills, 커넥터, MCP, Hooks, 작업 템플릿을 묶어 설치하고 배포</text>
  <text x="754" y="676" text-anchor="middle" class="tiny">배포 계층에 있으며 실행 경로의 마지막 단계가 아님</text>
</svg>
