<svg lang="vi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Luồng quyết định sandbox và phê duyệt của Codex</title>
  <desc id="desc">Codex đề xuất hành động để hoàn thành tác vụ rồi kiểm tra hành động có nằm trong sandbox không. Trong phạm vi thì thực thi và lưu bằng chứng; ngoài phạm vi thì yêu cầu con người quyết định theo chính sách phê duyệt. Nếu bị từ chối, thu hẹp hành động hoặc giải thích; nếu được duyệt, chỉ thực hiện hành động đã nêu rõ. Cả hai đường đều kết thúc bằng xác minh kết quả.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24.6px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.1px; }
    .label { fill: #f8fafc; font-size: 15.6px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.3px; }
    .tiny { fill: #94a3b8; font-size: 10.7px; }
    .edge { fill: #e2e8f0; font-size: 10.7px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="780" rx="8" fill="#020617"/>
  <rect width="1200" height="780" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Sandbox quản lý “được đi xa đến đâu”, phê duyệt quản lý “có hỏi trước khi vượt ranh giới không”</text>
  <text x="44" y="75" class="sub">Ràng buộc tác vụ mô tả ý định; ranh giới hệ thống giới hạn thực thi; diff, kiểm thử và trạng thái ngoài dùng để chấp nhận cuối cùng.</text>

  <rect x="66" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="191" y="158" text-anchor="middle" class="label">Mục tiêu và ràng buộc tác vụ</text>
  <text x="191" y="186" text-anchor="middle" class="note">Phạm vi cho phép · hành động cấm · tiêu chí chấp nhận</text>
  <path d="M316 169H390" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="515" y="158" text-anchor="middle" class="label">Codex đề xuất hành động</text>
  <text x="515" y="186" text-anchor="middle" class="note">Đọc/ghi · lệnh · mạng · ứng dụng</text>
  <path d="M640 169H714" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M850 112L986 169L850 226L714 169Z" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="850" y="160" text-anchor="middle" class="label">Trong sandbox hiện tại</text>
  <text x="850" y="185" text-anchor="middle" class="label">Nằm trong phạm vi?</text>

  <path d="M986 169H1080V298" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="1015" y="155" class="edge">Có</text>
  <rect x="950" y="298" width="230" height="98" rx="9" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1065" y="335" text-anchor="middle" class="label">Thực thi trong ranh giới</text>
  <text x="1065" y="364" text-anchor="middle" class="note">Vẫn phải ghi lại lệnh và đầu ra</text>

  <path d="M850 226V282H588" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="864" y="258" class="edge">Không</text>
  <rect x="318" y="282" width="270" height="104" rx="9" fill="#07101f" stroke="#fb7185" stroke-width="1.5"/>
  <text x="453" y="319" text-anchor="middle" class="label">Chính sách phê duyệt xử lý thế nào?</text>
  <text x="453" y="348" text-anchor="middle" class="note">Hỏi người dùng hoặc từ chối theo chính sách</text>
  <text x="453" y="371" text-anchor="middle" class="tiny">Tiến trình con cũng chịu cùng ràng buộc sandbox</text>

  <path d="M385 386V445H214" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="314" y="430" class="edge">Từ chối</text>
  <rect x="48" y="445" width="332" height="122" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5"/>
  <text x="214" y="483" text-anchor="middle" class="label">Thu hẹp hành động hoặc giải thích điểm chặn</text>
  <text x="214" y="513" text-anchor="middle" class="note">Dùng đường dẫn trong workspace · dùng dependency hiện có</text>
  <text x="214" y="541" text-anchor="middle" class="tiny">Không âm thầm chuyển sang hành động thay thế rủi ro cao hơn</text>

  <path d="M521 386V445H684" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="574" y="430" class="edge">Phê duyệt</text>
  <rect x="518" y="445" width="332" height="122" rx="9" fill="#2a240b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="684" y="483" text-anchor="middle" class="label">Chỉ thực hiện phạm vi được phê duyệt rõ ràng</text>
  <text x="684" y="513" text-anchor="middle" class="note">Lệnh cụ thể · đường dẫn · tên miền · thời hạn</text>
  <text x="684" y="541" text-anchor="middle" class="tiny">Hành động vượt ranh giới mới cần được đánh giá lại</text>

  <path d="M214 567V637H516" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M684 567V637H638" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1065 396V637H638" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#green-arrow)"/>
  <rect x="390" y="618" width="420" height="108" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="658" text-anchor="middle" class="label">Xác minh kết quả và tác dụng phụ bên ngoài</text>
  <text x="600" y="687" text-anchor="middle" class="note">diff · kiểm thử · nhật ký · trạng thái từ xa · khả năng khôi phục</text>
  <text x="600" y="712" text-anchor="middle" class="tiny">Không có hộp thoại không có nghĩa là không cần rà soát; được phê duyệt cũng không có nghĩa là kết quả đúng.</text>
</svg>
