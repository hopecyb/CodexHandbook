<svg lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Codex 하위 Agent 오케스트레이션 아키텍처</title>
  <desc id="desc">주 Agent는 전체 목표, 사용자 제약, 권한 모드를 유지하고 경계가 명확한 읽기 전용 탐색, 테스트 위치 확인, 방안 검토를 여러 독립 컨텍스트에 위임합니다. 하위 Agent는 샌드박스를 상속하고 작업 공간을 공유할 수 있으며, 결론과 증거를 반환합니다. 주 Agent가 충돌, 병합, 최종 검증을 처리합니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.8px; }
    .label { fill: #f8fafc; font-size: 16.3px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.9px; }
    .tiny { fill: #94a3b8; font-size: 11.2px; }
    .lane { fill: #fbbf24; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">주 Agent가 편성하고 하위 Agent가 집중하며 증거는 주 스레드에서 인수</text>
  <text x="44" y="75" class="sub">경계가 명확한 읽기 전용 작업을 우선 병렬화합니다. 컨텍스트 격리는 파일 격리를 뜻하지 않으므로 쓰기 작업에는 별도 소유권을 지정해야 합니다.</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">주 Agent: 전체 제어 유지</text>
  <text x="600" y="177" text-anchor="middle" class="note">사용자 목표 · 제약 · 계획 · 권한 모드</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">하위 작업 계약을 정의하고 결과 채택 여부와 최종 답변을 담당</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">경계가 있는 위임 계약</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">하위 Agent A</text>
  <text x="192" y="388" text-anchor="middle" class="note">코드 경로 읽기 전용 조사</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">산출물: 호출 체인과 파일 위치</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">독립 컨텍스트 · 권한 상속</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">다른 읽기 전용 작업과 병렬 가능</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">하위 Agent B</text>
  <text x="600" y="388" text-anchor="middle" class="note">테스트 위치 확인과 재현</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">산출물: 실패 명령과 로그</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">독립 컨텍스트 · 권한 상속</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">결론은 재검증 가능해야 함</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">하위 Agent C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">방안 또는 최근 변경 확인</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">산출물: 선택지, 증거, 위험</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">독립 컨텍스트 · 권한 상속</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">token 및 취합 비용 증가</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">공유 실행 경계</text>
  <text x="600" y="566" text-anchor="middle" class="note">샌드박스와 권한 모드는 주 작업에서 상속하며 여러 Agent가 같은 작업 공간을 볼 수 있음</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">같은 파일에 병렬로 쓰면 충돌합니다. 디렉터리 / 컴포넌트 / worktree별로 소유권을 배정하고 주 스레드에서 병합합니다.</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">주 Agent가 취합하고 충돌 처리 및 검증</text>
  <text x="600" y="721" text-anchor="middle" class="note">증거 비교 → 수정 결정 → 병합 → 테스트와 빌드 재실행</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">하위 작업 완료는 전체 작업 완료가 아닙니다. 최종 결론은 재검증 가능한 증거만으로 뒷받침합니다.</text>
</svg>
