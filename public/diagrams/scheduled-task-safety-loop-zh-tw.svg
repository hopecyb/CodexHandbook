<svg lang="zh-tw" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Scheduled task 安全執行閉環</title>
  <desc id="desc">先定義耐久任務並手動驗證，再選擇獨立任務或聊天內任務、Web 上下文或桌面本地專案與 worktree。任務使用預設沙箱無人值守執行，結果進入 Scheduled 供人工複核；有誤時調整提示詞、工具或頻率，無變化時結束，有高風險寫操作時等待人工。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 30px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 16px; }
    .label { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 14px; }
    .tiny { fill: #94a3b8; font-size: 12px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">從手動驗證到安全定時執行</text>
  <text x="44" y="72" class="sub">排程只負責再次觸發；穩定輸入、最小許可權、停止條件和人工複核必須寫進任務。</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. 定義耐久任務</text>
  <text x="130" y="219" text-anchor="middle" class="note">輸入 · 範圍 · 驗收</text>
  <text x="130" y="243" text-anchor="middle" class="note">無變化 · 失敗 · 停止</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">先寫清每次都要做什麼</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. 手動驗證</text>
  <text x="340" y="219" text-anchor="middle" class="note">同一提示詞 · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">同一工具與許可權</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">結果可審查後再排程</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. 選擇上下文</text>
  <text x="550" y="219" text-anchor="middle" class="note">獨立任務：每次重啟</text>
  <text x="550" y="243" text-anchor="middle" class="note">聊天內：延續上下文</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">按執行是否相互獨立判斷</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. 選擇材料</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web：上傳與連線工具</text>
  <text x="760" y="243" text-anchor="middle" class="note">桌面：專案 / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web 不能讀取本機目錄</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. 無人值守執行</text>
  <text x="970" y="219" text-anchor="middle" class="note">使用預設沙箱</text>
  <text x="970" y="243" text-anchor="middle" class="note">只授予必要許可權</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">本地任務需機器與 App 線上</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Scheduled 收件箱</text>
  <text x="680" y="390" text-anchor="middle" class="note">完成 · 失敗 · 需要關注</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">保留執行證據與未讀狀態</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">人工複核</text>
  <text x="400" y="390" text-anchor="middle" class="note">證據 · diff · 外部副作用</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">關鍵寫操作仍由人決定</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">結果過寬、材料不足或頻率不合適：調整後重新手動驗證</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">每次執行必須明確三條路徑</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">有發現：交付證據 · 無變化：簡短結束 · 無法完成：停止並等待人工</text>
</svg>
