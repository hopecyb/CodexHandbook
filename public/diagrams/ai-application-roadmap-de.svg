<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap für KI-Anwendungsentwicklung</title>
  <desc id="desc">Vertikale Zeitleiste in umgekehrter Reihenfolge: von Harness Engineering, Skills, Kontext-Engineering, Multi-Agent-Zusammenarbeit, Tool-Nutzung, MCP, Funktionsaufrufen und Prompt-Engineering zurück zu RAG. Jedes Datum bezeichnet nur die Veröffentlichung des genannten Papers, der Ankündigung oder des Artikels.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #111827; font-size: 24.3px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 12.2px; }
    .year { fill: #2563eb; font-size: 13.7px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 13.7px; font-weight: 700; }
    .node-date { fill: #6b7280; font-size: 9.9px; }
    .node-body { fill: #374151; font-size: 10.6px; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" fill="#ffffff"/>
  <rect x="42" y="34" width="816" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="86" class="title">Roadmap für KI-Anwendungsentwicklung</text>
  <text x="72" y="122" class="subtitle">Neueste zuerst. Daten beziehen sich nur auf die Quellen in der Tabelle, nicht auf die Entstehung.</text>
  <text x="72" y="148" class="subtitle">Von oben: Ausführungsumgebung und Wiederverwendung → Zusammenarbeit → Tool-Protokoll → Eingabesteuerung → Wissensverankerung.</text>

  <line x1="224" y1="218" x2="224" y2="1398" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-main)"/>

  <g transform="translate(70 1325)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2020</text>
  </g>
  <g transform="translate(70 1179)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2022</text>
  </g>
  <g transform="translate(70 1033)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2023</text>
  </g>
  <g transform="translate(70 887)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2024</text>
  </g>
  <g transform="translate(70 558)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2025</text>
  </g>
  <g transform="translate(70 229)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2026</text>
  </g>
  <g transform="translate(240 202)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#dc2626"/>
    <text x="28" y="32" class="node-title">Harness Engineering (Ausführungs-Harness)</text>
    <text x="28" y="55" class="node-date">2026-02-11 · Überprüfbare Ausführungsumgebung</text>
    <text x="28" y="78" class="node-body">Tools, Kontext, Feedback, Wiederherstellung und Qualitätsprüfungen als stabiles Gerüst bündeln.</text>
  </g>
  <g transform="translate(240 348)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Skills (Fähigkeiten)</text>
    <text x="28" y="55" class="node-date">2025-10-16 · Wiederverwendbare Workflow-Einheiten</text>
    <text x="28" y="78" class="node-body">Prompts, Schritte, Beispiele, Skripte und Ressourcen bündeln: Erfahrung bei Wiederholungen sicher nutzen.</text>
  </g>
  <g transform="translate(240 470)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Context Engineering (Kontext-Engineering)</text>
    <text x="28" y="55" class="node-date">2025-09-29 · Kontextgestaltung</text>
    <text x="28" y="78" class="node-body">Von guten Prompts zur Gestaltung dessen, was das Modell mit welcher Priorität sieht.</text>
  </g>
  <g transform="translate(240 592)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Multi-agent (Agenten-Kollaboration)</text>
    <text x="28" y="55" class="node-date">2025-06-13 · Rollenbasierte Zusammenarbeit</text>
    <text x="28" y="78" class="node-body">Recherche, Umsetzung, Review und Prüfung auf Rollen verteilen und parallel bearbeiten.</text>
  </g>
  <g transform="translate(240 714)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#0d9488"/>
    <text x="28" y="32" class="node-title">Tool Use (Tool-Nutzung)</text>
    <text x="28" y="55" class="node-date">2025-03-11 · Ausführung mit mehreren Tools</text>
    <text x="28" y="78" class="node-body">Das Modell wählt Tools, ruft sie auf, liest Ergebnisse und denkt im nächsten Schritt weiter.</text>
  </g>
  <g transform="translate(240 860)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#9333ea"/>
    <text x="28" y="32" class="node-title">MCP (Model Context Protocol)</text>
    <text x="28" y="55" class="node-date">2024-11-25 · Tool-Protokoll</text>
    <text x="28" y="78" class="node-body">Tools, Ressourcen, Prompts und Kontext per Protokoll anbinden; individuelle Integrationskosten senken.</text>
  </g>
  <g transform="translate(240 1006)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Function Calling (Funktionsaufrufe)</text>
    <text x="28" y="55" class="node-date">2023-06-13 · Strukturierte Aktionen</text>
    <text x="28" y="78" class="node-body">Neben Text: Funktionen, APIs und Geschäftsaktionen mit auswertbaren Parametern aufrufen.</text>
  </g>
  <g transform="translate(240 1152)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Prompt Engineering (Prompt-Engineering)</text>
    <text x="28" y="55" class="node-date">2022-11-30 · Eingabesteuerung</text>
    <text x="28" y="78" class="node-body">Mit Aufgabenbeschreibung, Beispielen und Formatvorgaben zu brauchbarer Ausgabe führen.</text>
  </g>
  <g transform="translate(240 1298)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#f97316"/>
    <text x="28" y="32" class="node-title">RAG (retrieval-augmentierte Generierung)</text>
    <text x="28" y="55" class="node-date">2020-05-22 · Wissensverankerung</text>
    <text x="28" y="78" class="node-body">Externe Quellen abrufen, Halluzinationen reduzieren und Antworten an nachvollziehbare Wissensquellen binden.</text>
  </g>
</svg>
