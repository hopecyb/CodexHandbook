<svg lang="vi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ chọn client Codex</title>
  <desc id="desc">Bắt đầu từ nơi công việc chủ yếu diễn ra: chọn App máy tính cho bảng điều khiển tác vụ cục bộ, CLI cho terminal và script, tích hợp IDE cho tệp và vùng chọn hiện tại, Cloud cho kho mã từ xa và môi trường cô lập. Bốn điểm vào có thể tiếp nối nhau; nguyên tắc là chọn nơi gần ngữ cảnh và dễ rà soát.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24.6px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.1px; }
    .label { fill: #f8fafc; font-size: 16.4px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.3px; }
    .tiny { fill: #94a3b8; font-size: 10.7px; }
    .badge { fill: #020617; font-size: 10.7px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Xem công việc diễn ra ở đâu rồi chọn điểm vào Codex</text>
  <text x="44" y="75" class="sub">Đây không phải bảng xếp hạng tính năng hay lựa chọn một trong bốn. Ưu tiên điểm vào gần ngữ cảnh hiện tại và dễ rà soát kết quả nhất.</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">Công việc lần này chủ yếu diễn ra ở đâu?</text>
  <text x="600" y="171" text-anchor="middle" class="note">Quản lý tác vụ · terminal · trình soạn thảo · kho mã từ xa</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">Điểm bắt đầu mặc định</text>
  <text x="62" y="358" class="label">App máy tính</text>
  <text x="62" y="389" class="note">Bảng điều khiển tác vụ cục bộ</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">Xem tác vụ và diff</text>
  <text x="62" y="469" class="note">Xử lý phê duyệt và công việc song song</text>
  <text x="62" y="497" class="tiny">Phù hợp: lần đầu sử dụng, tác vụ dài</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">Terminal</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">Quy trình dòng lệnh và script</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Gần Git và lệnh kiểm thử</text>
  <text x="354" y="469" class="note">Dễ ghi lại các bước có thể lặp lại</text>
  <text x="354" y="497" class="tiny">Phù hợp: người dùng terminal, tự động hóa</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">Nhiều IDE</text>
  <text x="646" y="358" class="label">Tích hợp IDE</text>
  <text x="646" y="389" class="note">Tệp và vùng chọn hiện tại</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">Đặt câu hỏi kèm ngữ cảnh trình soạn thảo</text>
  <text x="646" y="469" class="note">Sửa và rà soát tại chỗ</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">Chạy từ xa</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">Kho mã từ xa và môi trường cô lập</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">Ủy quyền song song và tác vụ dài</text>
  <text x="938" y="469" class="note">Rà soát tập trung sau khi hoàn tất</text>
  <text x="938" y="497" class="tiny">Phù hợp: cộng tác từ xa, làm việc bất đồng bộ</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">Có thể tiếp nối giữa các điểm vào</text>
  <text x="600" y="640" text-anchor="middle" class="note">Làm rõ vấn đề cục bộ trong IDE → giao tác vụ dài cho App / Cloud → chạy lệnh của nhóm bằng CLI → quay lại rà soát diff</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">Sau khi chọn, hãy hoàn thành một vòng thực tế gồm đọc, sửa, xem diff, xác minh và quyết định quyền.</text>
</svg>
