<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Choisir un client Codex</title>
  <desc id="desc">Partez du lieu de travail : App de bureau pour les tâches locales, CLI pour le terminal et les scripts, IDE pour le fichier actif, Cloud pour les dépôts distants. Ces points d'entrée peuvent se relayer ; choisissez le plus proche du contexte et le plus simple à réviser.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 23.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.5px; }
    .label { fill: #f8fafc; font-size: 15.6px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.7px; }
    .tiny { fill: #94a3b8; font-size: 10.1px; }
    .badge { fill: #020617; font-size: 10.1px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Repérez où se fait le travail, puis choisissez le point d'entrée Codex</text>
  <text x="44" y="75" class="sub">Ce n'est ni un classement ni un choix exclusif. Privilégiez le point d'entrée le plus proche du contexte et le plus simple à réviser.</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">Où se déroule principalement ce travail ?</text>
  <text x="600" y="171" text-anchor="middle" class="note">Gestion des tâches · terminal · éditeur · dépôt distant</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">Point de départ par défaut</text>
  <text x="62" y="358" class="label">App de bureau</text>
  <text x="62" y="389" class="note">Console de tâches locales</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">Consulter les tâches et les diffs</text>
  <text x="62" y="469" class="note">Gérer les approbations et le travail parallèle</text>
  <text x="62" y="497" class="tiny">Idéal pour : prise en main et tâches longues</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">Terminal</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">Flux en ligne de commande et scripts</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Au plus près de Git et des commandes de test</text>
  <text x="354" y="469" class="note">Facilite les étapes reproductibles</text>
  <text x="354" y="497" class="tiny">Idéal pour : terminal et automatisation</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">Plusieurs IDE</text>
  <text x="646" y="358" class="label">Intégration IDE</text>
  <text x="646" y="389" class="note">Fichier et sélection actifs</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">Interroger avec le contexte de l'éditeur</text>
  <text x="646" y="469" class="note">Modifier et réviser sur place</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">Exécution distante</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">Dépôt distant et environnement isolé</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">Délégation parallèle et tâches longues</text>
  <text x="938" y="469" class="note">Réviser ensemble les résultats à la fin</text>
  <text x="938" y="497" class="tiny">Idéal pour : travail distant et asynchrone</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">Les points d'entrée peuvent se relayer</text>
  <text x="600" y="640" text-anchor="middle" class="note">Clarifier dans l'IDE → confier le travail long à App / Cloud → lancer les commandes d'équipe dans CLI → revenir au diff</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">Bouclez lecture, modification, diff, vérification et décision d'autorisation.</text>
</svg>
