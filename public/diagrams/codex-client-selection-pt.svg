<svg lang="pt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Seleção de cliente Codex</title>
  <desc id="desc">Comece onde o trabalho acontece: App desktop para controle local de tarefas, CLI para terminais e scripts, integração IDE para o arquivo e a seleção atuais, e Cloud para repositórios remotos e ambientes isolados. Os pontos de entrada podem passar o trabalho adiante; escolha o mais próximo do contexto e mais fácil de revisar.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.8px; }
    .label { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12px; }
    .tiny { fill: #94a3b8; font-size: 10.4px; }
    .badge { fill: #020617; font-size: 10.4px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Comece por onde o trabalho acontece e então escolha um ponto de entrada do Codex</text>
  <text x="44" y="75" class="sub">Não é um ranking de capacidades nem uma escolha única entre quatro. Prefira o ponto de entrada mais próximo do contexto e mais fácil de revisar.</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">Onde este trabalho acontece principalmente?</text>
  <text x="600" y="171" text-anchor="middle" class="note">Gestão de tarefas · terminal · editor · repositório remoto</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">Ponto de partida padrão</text>
  <text x="62" y="358" class="label">App desktop</text>
  <text x="62" y="389" class="note">Console local de tarefas</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">Ver tarefas e diffs</text>
  <text x="62" y="469" class="note">Gerenciar aprovações e trabalho paralelo</text>
  <text x="62" y="497" class="tiny">Melhor para: primeiro uso e tarefas longas</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">Terminal</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">Fluxos de linha de comando e scripts</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Perto do Git e dos comandos de teste</text>
  <text x="354" y="469" class="note">Fácil registrar etapas repetíveis</text>
  <text x="354" y="497" class="tiny">Melhor para: usuários de terminal e automação</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">Várias IDEs</text>
  <text x="646" y="358" class="label">Integração IDE</text>
  <text x="646" y="389" class="note">Arquivo e seleção atuais</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">Perguntar com contexto do editor</text>
  <text x="646" y="469" class="note">Editar e revisar no lugar</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">Execução remota</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">Repositório remoto e ambiente isolado</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">Delegação paralela e tarefas mais longas</text>
  <text x="938" y="469" class="note">Revisar resultados juntos ao finalizar</text>
  <text x="938" y="497" class="tiny">Melhor para: trabalho remoto e assíncrono</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">Pontos de entrada podem passar o trabalho adiante</text>
  <text x="600" y="640" text-anchor="middle" class="note">Esclarecer localmente na IDE → passar trabalho longo para App / Cloud → executar comandos da equipe na CLI → voltar à revisão do diff</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">Complete um ciclo real de leitura, edição, revisão de diff, verificação e decisões de permissão.</text>
</svg>
