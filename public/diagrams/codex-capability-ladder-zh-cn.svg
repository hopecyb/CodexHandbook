<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">从一次提示到团队能力包</title>
  <desc id="desc">先把任务说清楚，再把重复流程沉淀为可复用、可验证、可治理的组件。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { fill: #111827; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .lane-label { fill: #374151; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-note { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
  </defs>
  <rect data-graph-role="background" width="960" height="560" fill="#ffffff"/>
  <text x="48" y="52" text-anchor="start" class="title">从一次提示到团队能力包</text>
  <text x="48" y="76" text-anchor="start" class="subtitle">先把任务说清楚，再把重复流程沉淀为可复用、可验证、可治理的组件。</text>
  <rect data-graph-role="container" x="48" y="106" width="864" height="102" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="66" y="132" text-anchor="start" class="lane-label">一次任务</text>
  <rect data-graph-role="container" x="48" y="236" width="864" height="132" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="66" y="262" text-anchor="start" class="lane-label">稳定流程</text>
  <rect data-graph-role="container" x="48" y="396" width="864" height="102" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="66" y="422" text-anchor="start" class="lane-label">团队分发与自动运行</text>
  <rect data-graph-role="node" x="92" y="148" width="170" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="177.0" y="168" text-anchor="middle" class="node-title">提示词</text>
  <text x="177.0" y="176" text-anchor="middle" class="node-note">目标 / 约束 / 验收</text>
  <rect data-graph-role="node" x="318" y="148" width="170" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="403.0" y="168" text-anchor="middle" class="node-title">模板</text>
  <text x="403.0" y="176" text-anchor="middle" class="node-note">保住任务结构</text>
  <rect data-graph-role="node" x="92" y="286" width="170" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="177.0" y="306" text-anchor="middle" class="node-title">Skill</text>
  <text x="177.0" y="326" text-anchor="middle" class="node-note">步骤、模板、脚本</text>
  <rect data-graph-role="node" x="314" y="286" width="170" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="399.0" y="306" text-anchor="middle" class="node-title">子 Agent</text>
  <text x="399.0" y="326" text-anchor="middle" class="node-note">独立子任务</text>
  <rect data-graph-role="node" x="536" y="286" width="170" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="621.0" y="306" text-anchor="middle" class="node-title">MCP</text>
  <text x="621.0" y="326" text-anchor="middle" class="node-note">外部系统工具</text>
  <rect data-graph-role="node" x="758" y="286" width="126" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="821.0" y="306" text-anchor="middle" class="node-title">Hook</text>
  <text x="821.0" y="326" text-anchor="middle" class="node-note">自动守护栏</text>
  <rect data-graph-role="node" x="196" y="442" width="220" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="306.0" y="462" text-anchor="middle" class="node-title">Plugin</text>
  <text x="306.0" y="470" text-anchor="middle" class="node-note">打包、安装、升级、回收</text>
  <rect data-graph-role="node" x="548" y="442" width="220" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="658.0" y="462" text-anchor="middle" class="node-title">Automation</text>
  <text x="658.0" y="470" text-anchor="middle" class="node-note">定时、监控、无人值守</text>
  <path data-graph-role="edge" d="M 266 169 L 310 169" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M 403 208 L 210 280" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 266 313 L 306 313" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 484 313 L 528 313" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 706 313 L 750 313" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M 480 368 L 345 436" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path data-graph-role="edge" d="M 500 368 L 620 436" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path data-graph-role="edge" d="M 420 463 L 540 463" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="280" y="158" text-anchor="start" class="small">反复出现</text>
  <g data-graph-role="legend" transform="translate(48,524)">
    <line data-graph-role="decoration" x1="0" y1="0" x2="28" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text data-graph-role="decoration" x="38" y="4" class="small">主流程沉淀</text>
    <line data-graph-role="decoration" x1="160" y1="0" x2="188" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text data-graph-role="decoration" x="198" y="4" class="small">能力组合</text>
    <line data-graph-role="decoration" x1="320" y1="0" x2="348" y2="0" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text data-graph-role="decoration" x="358" y="4" class="small">团队治理</text>
  </g>
</svg>