<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Auswahl der Codex-Erweiterungsmethode</title>
  <desc id="desc">Mechanismus nach dem zu speichernden Objekt wählen: Prompt für eine Einzelaufgabe, AGENTS.md für Projektregeln, Skill für wiederverwendbare Abläufe, MCP für externe Werkzeuge, Hook für Lebenszyklusschutz, Plugin für gebündelte Verteilung, Scheduled task für zeitgesteuerte Wiederholung.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 22.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.2px; }
    .lane { fill: #cbd5e1; font-size: 12.2px; font-weight: 700; }
    .label { fill: #f8fafc; font-size: 13.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 10.6px; }
    .tiny { fill: #94a3b8; font-size: 9.1px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1100" height="700" rx="8" fill="#020617"/>
  <rect width="1100" height="700" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Erst fragen, was dauerhaft bleiben soll, dann den Erweiterungsmechanismus wählen</text>
  <text x="44" y="70" class="sub">Diese Mechanismen sind kombinierbar, haben aber verschiedene Aufgaben; sie bilden keine Aufstiegsleiter.</text>

  <rect x="390" y="96" width="320" height="68" rx="8" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="550" y="124" text-anchor="middle" class="label">Was ist das Hauptproblem?</text>
  <text x="550" y="147" text-anchor="middle" class="note">Anweisungen · Regeln · Ablauf · Werkzeuge · Auslöser · Verteilung</text>

  <path d="M550 164V198H190V224" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 164V224" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 164V198H910V224" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="224" width="300" height="382" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="190" y="254" text-anchor="middle" class="lane">Wissen und Vorgehen bewahren</text>
  <rect x="70" y="284" width="240" height="76" rx="8" fill="#083344" stroke="#22d3ee"/>
  <text x="190" y="313" text-anchor="middle" class="label">Prompt</text>
  <text x="190" y="337" text-anchor="middle" class="note">Nur für diese Aufgabe</text>
  <path d="M190 360V392" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="205" y="382" class="tiny">Diese Aufgabenart wiederholt sich</text>
  <rect x="70" y="394" width="240" height="76" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="190" y="423" text-anchor="middle" class="label">Skill</text>
  <text x="190" y="447" text-anchor="middle" class="note">Wiederverwendbarer Ablauf, Referenzen und Skripte</text>
  <rect x="70" y="500" width="240" height="76" rx="8" fill="#3b0764" stroke="#a78bfa"/>
  <text x="190" y="529" text-anchor="middle" class="label">AGENTS.md</text>
  <text x="190" y="553" text-anchor="middle" class="note">Regeln für jeden Projektzugriff</text>

  <rect x="400" y="224" width="300" height="382" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="550" y="254" text-anchor="middle" class="lane">Ausführung um Funktionen erweitern</text>
  <rect x="430" y="284" width="240" height="76" rx="8" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="550" y="313" text-anchor="middle" class="label">MCP / Connector</text>
  <text x="550" y="337" text-anchor="middle" class="note">Externe Werkzeuge und Daten anbinden</text>
  <rect x="430" y="394" width="240" height="76" rx="8" fill="#4c0519" stroke="#fb7185"/>
  <text x="550" y="423" text-anchor="middle" class="label">Hook</text>
  <text x="550" y="447" text-anchor="middle" class="note">An Lebenszykluspunkten prüfen oder blockieren</text>
  <rect x="430" y="500" width="240" height="76" rx="8" fill="#422006" stroke="#fbbf24"/>
  <text x="550" y="529" text-anchor="middle" class="label">Unter-Agent</text>
  <text x="550" y="553" text-anchor="middle" class="note">Unabhängige Teilprobleme parallel bearbeiten</text>

  <rect x="760" y="224" width="300" height="382" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="910" y="254" text-anchor="middle" class="lane">Verteilen oder zeitgesteuert auslösen</text>
  <rect x="790" y="304" width="240" height="90" rx="8" fill="#3f1d0b" stroke="#fb923c"/>
  <text x="910" y="333" text-anchor="middle" class="label">Plugin</text>
  <text x="910" y="357" text-anchor="middle" class="note">Skills, Konnektoren und MCP bündeln</text>
  <text x="910" y="378" text-anchor="middle" class="tiny">Kann auch Hooks und Aufgabenvorlagen enthalten</text>
  <rect x="790" y="444" width="240" height="90" rx="8" fill="#3f0713" stroke="#fb7185"/>
  <text x="910" y="473" text-anchor="middle" class="label">Scheduled task</text>
  <text x="910" y="497" text-anchor="middle" class="note">Zeitgesteuert wiederholen</text>
  <text x="910" y="518" text-anchor="middle" class="tiny">Aufgabe vor der Planung verifizieren</text>

  <rect x="120" y="626" width="860" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="651" text-anchor="middle" class="note">Typische Kombination: AGENTS.md für Regeln + Skill für Ablauf + MCP für Werkzeuge + Hook für Grenzen</text>
  <text x="550" y="673" text-anchor="middle" class="tiny">Plugin verteilt; Scheduled task löst zeitgesteuert aus</text>
</svg>
