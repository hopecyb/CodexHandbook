<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Architektur der Codex-Unter-Agent-Orchestrierung</title>
  <desc id="desc">Der Haupt-Agent behält globale Ziele, Nutzervorgaben und Berechtigungsmodus und delegiert klar begrenzte Leseanalysen, Testsuche und Lösungsprüfung an unabhängige Kontexte. Unter-Agents erben die Sandbox, teilen eventuell den Arbeitsbereich und liefern Ergebnisse samt Nachweisen; der Haupt-Agent löst Konflikte, führt zusammen und verifiziert abschließend.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 22.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.2px; }
    .label { fill: #f8fafc; font-size: 14.4px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.4px; }
    .tiny { fill: #94a3b8; font-size: 9.9px; }
    .lane { fill: #fbbf24; font-size: 10.6px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Haupt-Agent orchestriert, Unter-Agents fokussieren, Nachweise gehen zur Abnahme an den Hauptthread</text>
  <text x="44" y="75" class="sub">Klare Leseaufgaben zuerst parallelisieren. Kontextisolation ist keine Dateisolation; Schreibaufgaben brauchen getrennte Zuständigkeiten.</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">Haupt-Agent: behält die Gesamtsteuerung</text>
  <text x="600" y="177" text-anchor="middle" class="note">Nutzerziel · Vorgaben · Plan · Berechtigungsmodus</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">Teilaufträge definieren, Ergebnisse auswählen, Endantwort verantworten</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">Begrenzter Delegationsauftrag</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">Unter-Agent A</text>
  <text x="192" y="388" text-anchor="middle" class="note">Schreibgeschützter Codepfad</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">Liefern: Aufrufkette und Dateipfade</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">Unabhängiger Kontext · geerbte Berechtigungen</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">Parallel zu anderen Leseaufgaben möglich</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">Unter-Agent B</text>
  <text x="600" y="388" text-anchor="middle" class="note">Tests und Reproduktion finden</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">Liefern: fehlschlagender Befehl und Protokolle</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">Unabhängiger Kontext · geerbte Berechtigungen</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">Ergebnisse müssen reproduzierbar sein</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">Unter-Agent C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">Optionen oder aktuelle Änderungen prüfen</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">Liefern: Optionen, Nachweise und Risiken</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">Unabhängiger Kontext · geerbte Berechtigungen</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">Erhöht token- und Konsolidierungskosten</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">Gemeinsame Ausführungsgrenze</text>
  <text x="600" y="566" text-anchor="middle" class="note">Sandbox und Berechtigungsmodus werden von der Hauptaufgabe geerbt; mehrere Agents können denselben Arbeitsbereich sehen</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">Paralleles Schreiben in dieselbe Datei führt zu Konflikten: Zuständigkeit nach Verzeichnis, Komponente oder worktree trennen, dann im Hauptthread zusammenführen.</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">Haupt-Agent konsolidiert, löst Konflikte und verifiziert</text>
  <text x="600" y="721" text-anchor="middle" class="note">Nachweise vergleichen → Änderungen festlegen → zusammenführen → Tests und Build erneut ausführen</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">Ein abgeschlossener Teilauftrag beendet nicht die Gesamtaufgabe; nur reproduzierbare Nachweise tragen das Endergebnis.</text>
</svg>
