<svg lang="vi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc điều phối Agent con của Codex</title>
  <desc id="desc">Agent chính giữ mục tiêu tổng thể, ràng buộc người dùng và chế độ quyền, rồi giao việc khám phá chỉ đọc, định vị kiểm thử và kiểm tra phương án có ranh giới rõ cho nhiều ngữ cảnh độc lập. Agent con kế thừa sandbox và có thể dùng chung workspace, trả kết luận cùng bằng chứng để Agent chính xử lý xung đột, hợp nhất và xác minh cuối.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 24.6px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.1px; }
    .label { fill: #f8fafc; font-size: 15.6px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.3px; }
    .tiny { fill: #94a3b8; font-size: 10.7px; }
    .lane { fill: #fbbf24; font-size: 11.5px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Agent chính điều phối, Agent con tập trung, bằng chứng trở về luồng chính để chấp nhận</text>
  <text x="44" y="75" class="sub">Ưu tiên chạy song song công việc chỉ đọc có ranh giới rõ. Cô lập ngữ cảnh không đồng nghĩa cô lập tệp; tác vụ ghi phải có quyền sở hữu riêng.</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">Agent chính: giữ quyền kiểm soát tổng thể</text>
  <text x="600" y="177" text-anchor="middle" class="note">Mục tiêu người dùng · ràng buộc · kế hoạch · chế độ quyền</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">Định nghĩa hợp đồng tác vụ con, quyết định dùng kết quả hay không và chịu trách nhiệm trả lời cuối</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">Hợp đồng ủy quyền có ranh giới</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">Agent con A</text>
  <text x="192" y="388" text-anchor="middle" class="note">Đọc đường dẫn mã ở chế độ chỉ đọc</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">Bàn giao: chuỗi gọi và vị trí tệp</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">Ngữ cảnh độc lập · kế thừa quyền</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">Có thể chạy song song với tác vụ chỉ đọc khác</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">Agent con B</text>
  <text x="600" y="388" text-anchor="middle" class="note">Định vị kiểm thử và tái hiện</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">Bàn giao: lệnh thất bại và nhật ký</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">Ngữ cảnh độc lập · kế thừa quyền</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">Kết luận phải có thể kiểm tra lại</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">Agent con C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">Kiểm tra phương án hoặc thay đổi gần đây</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">Bàn giao: lựa chọn, bằng chứng và rủi ro</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">Ngữ cảnh độc lập · kế thừa quyền</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">Tăng chi phí token và tổng hợp</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">Ranh giới thực thi dùng chung</text>
  <text x="600" y="566" text-anchor="middle" class="note">Sandbox và chế độ quyền được kế thừa từ tác vụ chính; nhiều Agent có thể thấy cùng workspace</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">Ghi song song vào cùng tệp sẽ xung đột: phân quyền sở hữu theo thư mục / thành phần / worktree rồi để luồng chính hợp nhất.</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">Agent chính tổng hợp, xử lý xung đột và xác minh</text>
  <text x="600" y="721" text-anchor="middle" class="note">So sánh bằng chứng → quyết định sửa → hợp nhất → chạy lại kiểm thử và build</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">Tác vụ con hoàn tất không có nghĩa tác vụ tổng thể hoàn tất; kết luận cuối chỉ dựa trên bằng chứng có thể kiểm tra lại.</text>
</svg>
