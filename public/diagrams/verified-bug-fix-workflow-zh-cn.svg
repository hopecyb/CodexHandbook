<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="title desc">
  <title id="title">带验证的 Bug 修复工作流</title>
  <desc id="desc">先运行测试稳定复现红灯，记录失败证据；再定位根因并做最小修复，运行相关测试得到绿灯，然后执行全量回归和 diff 审查。任一环节失败都返回相应步骤。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 30px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 16px; }
    .label { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 14px; }
    .tiny { fill: #94a3b8; font-size: 12px; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="590" rx="8" fill="#020617"/>
  <rect width="1100" height="590" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">带验证的 Bug 修复：先红、再绿、再回归</text>
  <text x="44" y="70" class="sub">测试通过只有在先稳定复现原问题之后，才能成为修复证据。</text>

  <path d="M186 260H226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M374 260H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M562 260H602" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 260H790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M938 260H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M864 320V410H488V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M676 320V456H300V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="38" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="112" y="235" text-anchor="middle" class="label">1. 稳定复现</text>
  <text x="112" y="261" text-anchor="middle" class="note">运行失败测试</text>
  <text x="112" y="283" text-anchor="middle" class="note">保存断言与堆栈</text>
  <text x="112" y="304" text-anchor="middle" class="tiny" fill="#fb7185">RED · 预期失败</text>

  <rect x="226" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" class="label">2. 定位根因</text>
  <text x="300" y="261" text-anchor="middle" class="note">读实现与测试</text>
  <text x="300" y="283" text-anchor="middle" class="note">排除相邻假设</text>
  <text x="300" y="304" text-anchor="middle" class="tiny">先解释，不改代码</text>

  <rect x="414" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="488" y="235" text-anchor="middle" class="label">3. 最小修复</text>
  <text x="488" y="261" text-anchor="middle" class="note">只改根因路径</text>
  <text x="488" y="283" text-anchor="middle" class="note">保留公开行为</text>
  <text x="488" y="304" text-anchor="middle" class="tiny">拒绝顺手重构</text>

  <rect x="602" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="676" y="235" text-anchor="middle" class="label">4. 相关测试</text>
  <text x="676" y="261" text-anchor="middle" class="note">原测试变绿</text>
  <text x="676" y="283" text-anchor="middle" class="note">边界测试通过</text>
  <text x="676" y="304" text-anchor="middle" class="tiny" fill="#34d399">GREEN</text>

  <rect x="790" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="864" y="235" text-anchor="middle" class="label">5. 回归与审查</text>
  <text x="864" y="261" text-anchor="middle" class="note">全量测试 · lint</text>
  <text x="864" y="283" text-anchor="middle" class="note">diff 与范围检查</text>
  <text x="864" y="304" text-anchor="middle" class="tiny">记录剩余风险</text>

  <rect x="974" y="218" width="94" height="84" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1021" y="250" text-anchor="middle" class="label">交付</text>
  <text x="1021" y="275" text-anchor="middle" class="note">证据齐全</text>

  <rect x="154" y="478" width="792" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="504" text-anchor="middle" class="note">证据链：失败命令与断言 → 根因解释 → 最小 diff → 相关测试通过 → 全量回归通过 → 人工范围审查</text>
  <text x="550" y="526" text-anchor="middle" class="tiny">相关测试失败返回最小修复；全量回归或 diff 审查失败返回根因分析。</text>
</svg>
