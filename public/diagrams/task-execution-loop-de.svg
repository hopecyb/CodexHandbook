<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Zyklus von der Aufgabenbeschreibung zum verifizierbaren Ergebnis</title>
  <desc id="desc">Ziel, Hintergrund, Eingaben, Vorgaben, Abnahme und Berechtigungen bilden die Aufgabenbeschreibung. Codex erkundet, plant, führt aus und verifiziert; bei Fehlern geht es mit Nachweisen zur Aufgabenbeschreibung oder zum Plan zurück, bei Erfolg zur Auslieferung.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 22.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.2px; }
    .label { fill: #f8fafc; font-size: 13.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 10.6px; }
    .tiny { fill: #94a3b8; font-size: 9.1px; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1000" height="560" rx="8" fill="#020617"/>
  <rect width="1000" height="560" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Von der Aufgabenbeschreibung zum verifizierbaren Ergebnis</text>
  <text x="44" y="70" class="sub">Ein guter Prompt ist kein Endpunkt; er verbindet Ausführung, Nachweise und Rückmeldung zu einem Zyklus.</text>

  <path d="M260 282H310" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M438 282H478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M606 282H646" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M774 282H814" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M878 336V406H770" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M846 336V454H170V378" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="40" y="112" width="220" height="266" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="142" text-anchor="middle" class="label">Aufgabenbeschreibung</text>
  <text x="115" y="177" text-anchor="end" class="note">Ziel</text><text x="125" y="177" class="tiny">Endergebnis</text>
  <text x="115" y="207" text-anchor="end" class="note">Hintergrund</text><text x="125" y="207" class="tiny">Warum es wichtig ist</text>
  <text x="115" y="237" text-anchor="end" class="note">Eingaben</text><text x="125" y="237" class="tiny">Erforderliches Material</text>
  <text x="115" y="267" text-anchor="end" class="note">Vorgaben</text><text x="125" y="267" class="tiny">Umfang und Verbote</text>
  <text x="115" y="297" text-anchor="end" class="note">Abnahme</text><text x="125" y="297" class="tiny">Beobachtbare Nachweise</text>
  <text x="115" y="327" text-anchor="end" class="note">Berechtigungen</text><text x="125" y="327" class="tiny">Netzwerk · Schreiben · Freigaben</text>
  <line x1="62" y1="344" x2="228" y2="344" stroke="#1e293b"/>
  <text x="145" y="364" text-anchor="middle" class="tiny">Bei fehlenden Informationen fragen, nicht raten</text>

  <rect x="310" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="374" y="266" text-anchor="middle" class="label">Erkunden</text>
  <text x="374" y="291" text-anchor="middle" class="note">Ist-Zustand · Umfang</text>
  <text x="374" y="311" text-anchor="middle" class="note">Risiken · Unbekanntes</text>

  <rect x="478" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="542" y="266" text-anchor="middle" class="label">Planen</text>
  <text x="542" y="291" text-anchor="middle" class="note">Schritte · Dateien</text>
  <text x="542" y="311" text-anchor="middle" class="note">Risiken · Verifizierung</text>

  <rect x="646" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="266" text-anchor="middle" class="label">Ausführen</text>
  <text x="710" y="291" text-anchor="middle" class="note">Kleine Änderungen</text>
  <text x="710" y="311" text-anchor="middle" class="note">Umfang begrenzen</text>

  <rect x="814" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="878" y="266" text-anchor="middle" class="label">Verifizieren</text>
  <text x="878" y="291" text-anchor="middle" class="note">Tests · diff</text>
  <text x="878" y="311" text-anchor="middle" class="note">Screenshots · Quellen</text>

  <rect x="490" y="382" width="280" height="62" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="408" text-anchor="middle" class="label">Bestanden: verifizierbares Ergebnis liefern</text>
  <text x="630" y="429" text-anchor="middle" class="tiny">Artefakt + Nachweise + Restrisiken</text>
  <text x="905" y="393" class="tiny" fill="#34d399">Bestanden</text>
  <text x="460" y="472" class="tiny" fill="#fb7185">Fehlgeschlagen: mit Fehlernachweisen zur Aufgabe oder zum Plan zurückkehren</text>
</svg>
