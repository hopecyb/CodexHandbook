<svg lang="zh-tw" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">AI 應用工程路線圖</title>
  <desc id="desc">按時間倒序排列的縱向時間線：從 Harness Engineering、Skills、上下文工程、多智慧體協作、工具使用、MCP、函式呼叫、提示詞工程回溯到 RAG。日期只指對應論文、公告或文章的釋出日期。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .title { fill: #111827; font-size: 32px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 16px; }
    .year { fill: #2563eb; font-size: 18px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 18px; font-weight: 700; }
    .node-date { fill: #6b7280; font-size: 13px; }
    .node-body { fill: #374151; font-size: 14px; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" fill="#ffffff"/>
  <rect x="42" y="34" width="816" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="86" class="title">AI 應用工程路線圖</text>
  <text x="72" y="122" class="subtitle">時間倒序。日期只指正文表格所列的論文、公告或文章，不代表概念誕生。</text>
  <text x="72" y="148" class="subtitle">縱向閱讀：執行環境與複用 → 協同執行 → 工具協議 → 輸入控制 → 知識接地。</text>

  <line x1="224" y1="218" x2="224" y2="1398" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-main)"/>

  <g transform="translate(70 1325)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2020</text>
  </g>
  <g transform="translate(70 1179)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2022</text>
  </g>
  <g transform="translate(70 1033)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2023</text>
  </g>
  <g transform="translate(70 887)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2024</text>
  </g>
  <g transform="translate(70 558)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2025</text>
  </g>
  <g transform="translate(70 229)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2026</text>
  </g>
  <g transform="translate(240 202)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#dc2626"/>
    <text x="28" y="32" class="node-title">Harness Engineering（駕馭工程）</text>
    <text x="28" y="55" class="node-date">2026-02-11 · 可驗證執行環境</text>
    <text x="28" y="78" class="node-body">把工具、上下文、反饋、恢復和質量門檻合成穩定的任務腳手架。</text>
  </g>
  <g transform="translate(240 348)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Skills（技能）</text>
    <text x="28" y="55" class="node-date">2025-10-16 · 可複用工作流單元</text>
    <text x="28" y="78" class="node-body">把提示、步驟、示例、指令碼和資源打包，讓 AI 在重複任務中穩定複用經驗。</text>
  </g>
  <g transform="translate(240 470)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Context Engineering（上下文工程）</text>
    <text x="28" y="55" class="node-date">2025-09-29 · 上下文設計</text>
    <text x="28" y="78" class="node-body">從“寫好提示詞”轉向“設計模型能看到什麼、按什麼優先順序看到”。</text>
  </g>
  <g transform="translate(240 592)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Multi-agent（多智慧體協作）</text>
    <text x="28" y="55" class="node-date">2025-06-13 · 角色協作</text>
    <text x="28" y="78" class="node-body">把研究、實現、審查、驗證拆給不同角色，讓複雜任務可並行推進。</text>
  </g>
  <g transform="translate(240 714)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#0d9488"/>
    <text x="28" y="32" class="node-title">Tool Use（工具使用）</text>
    <text x="28" y="55" class="node-date">2025-03-11 · 多工具執行</text>
    <text x="28" y="78" class="node-body">模型開始在任務中選擇工具、呼叫工具、讀取結果，並繼續下一步推理。</text>
  </g>
  <g transform="translate(240 860)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#9333ea"/>
    <text x="28" y="32" class="node-title">MCP（模型上下文協議）</text>
    <text x="28" y="55" class="node-date">2024-11-25 · 工具協議</text>
    <text x="28" y="78" class="node-body">把工具、資源、提示和上下文暴露成協議層介面，減少一次性整合成本。</text>
  </g>
  <g transform="translate(240 1006)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Function Calling（函式呼叫）</text>
    <text x="28" y="55" class="node-date">2023-06-13 · 結構化動作</text>
    <text x="28" y="78" class="node-body">讓模型不只生成文本，而是以可解析引數呼叫函式、API 和業務動作。</text>
  </g>
  <g transform="translate(240 1152)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Prompt Engineering（提示詞工程）</text>
    <text x="28" y="55" class="node-date">2022-11-30 · 輸入控制</text>
    <text x="28" y="78" class="node-body">用任務說明、示例和格式約束，引導模型給出可用的輸出。</text>
  </g>
  <g transform="translate(240 1298)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#f97316"/>
    <text x="28" y="32" class="node-title">RAG（檢索增強生成）</text>
    <text x="28" y="55" class="node-date">2020-05-22 · 知識接地</text>
    <text x="28" y="78" class="node-body">把外部資料檢索進上下文，降低幻覺，把回答繫結到可追溯知識源。</text>
  </g>
</svg>
