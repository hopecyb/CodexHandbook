<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">タスク説明から検証可能な結果までの閉ループ</title>
  <desc id="desc">目標、背景、入力、制約、受け入れ条件、権限でタスク説明を構成します。Codex は探索、計画、実行、検証を順に行い、不合格なら証拠を添えてタスク説明または計画に戻り、合格なら結果を提出します。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 26.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 14.1px; }
    .label { fill: #f8fafc; font-size: 15.8px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.3px; }
    .tiny { fill: #94a3b8; font-size: 10.6px; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1000" height="560" rx="8" fill="#020617"/>
  <rect width="1000" height="560" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">タスク説明から検証可能な結果へ</text>
  <text x="44" y="70" class="sub">良いプロンプトは終点ではありません。実行、証拠、フィードバックを 1 つの閉ループにします。</text>

  <path d="M260 282H310" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M438 282H478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M606 282H646" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M774 282H814" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M878 336V406H770" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M846 336V454H170V378" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="40" y="112" width="220" height="266" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="142" text-anchor="middle" class="label">タスク説明</text>
  <text x="115" y="177" text-anchor="end" class="note">目標</text><text x="125" y="177" class="tiny">最終成果物</text>
  <text x="115" y="207" text-anchor="end" class="note">背景</text><text x="125" y="207" class="tiny">実施理由</text>
  <text x="115" y="237" text-anchor="end" class="note">入力</text><text x="125" y="237" class="tiny">必ず確認する資料</text>
  <text x="115" y="267" text-anchor="end" class="note">制約</text><text x="125" y="267" class="tiny">範囲と禁止事項</text>
  <text x="115" y="297" text-anchor="end" class="note">受け入れ条件</text><text x="125" y="297" class="tiny">観察可能な証拠</text>
  <text x="115" y="327" text-anchor="end" class="note">権限</text><text x="125" y="327" class="tiny">ネットワーク · 書き込み · 承認</text>
  <line x1="62" y1="344" x2="228" y2="344" stroke="#1e293b"/>
  <text x="145" y="364" text-anchor="middle" class="tiny">情報不足なら推測せず先に質問</text>

  <rect x="310" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="374" y="266" text-anchor="middle" class="label">探索</text>
  <text x="374" y="291" text-anchor="middle" class="note">現状 · 範囲</text>
  <text x="374" y="311" text-anchor="middle" class="note">リスク · 不明点</text>

  <rect x="478" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="542" y="266" text-anchor="middle" class="label">計画</text>
  <text x="542" y="291" text-anchor="middle" class="note">手順 · ファイル</text>
  <text x="542" y="311" text-anchor="middle" class="note">リスク · 検証</text>

  <rect x="646" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="266" text-anchor="middle" class="label">実行</text>
  <text x="710" y="291" text-anchor="middle" class="note">小さな単位で変更</text>
  <text x="710" y="311" text-anchor="middle" class="note">範囲を制御</text>

  <rect x="814" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="878" y="266" text-anchor="middle" class="label">検証</text>
  <text x="878" y="291" text-anchor="middle" class="note">テスト · diff</text>
  <text x="878" y="311" text-anchor="middle" class="note">スクリーンショット · 出典</text>

  <rect x="490" y="382" width="280" height="62" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="408" text-anchor="middle" class="label">合格：検証可能な結果を提出</text>
  <text x="630" y="429" text-anchor="middle" class="tiny">成果物 + 証拠 + 残存リスク</text>
  <text x="905" y="393" class="tiny" fill="#34d399">合格</text>
  <text x="460" y="472" class="tiny" fill="#fb7185">不合格：失敗証拠を添えてタスク説明または計画へ戻る</text>
</svg>
