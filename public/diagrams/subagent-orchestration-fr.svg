<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Architecture d'orchestration des sous-agents Codex</title>
  <desc id="desc">L'Agent principal conserve l'objectif global, les contraintes et le mode d'autorisation. Il délègue l'exploration en lecture seule, la localisation des tests et la vérification des options à des contextes indépendants. Les sous-agents héritent du bac à sable et peuvent partager le workspace ; ils rendent conclusions et preuves, puis l'Agent principal résout les conflits, fusionne et vérifie.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 23.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.5px; }
    .label { fill: #f8fafc; font-size: 14.8px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.7px; }
    .tiny { fill: #94a3b8; font-size: 10.1px; }
    .lane { fill: #fbbf24; font-size: 10.9px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="800" rx="8" fill="#020617"/>
  <rect width="1200" height="800" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">L'Agent principal orchestre, les sous-agents se concentrent, les preuves reviennent au fil principal</text>
  <text x="44" y="75" class="sub">Parallélisez d'abord le travail borné en lecture seule. Isoler le contexte n'isole pas les fichiers ; les écritures exigent une propriété distincte.</text>

  <rect x="356" y="108" width="488" height="132" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" class="label">Agent principal : conserver le contrôle global</text>
  <text x="600" y="177" text-anchor="middle" class="note">Objectif utilisateur · contraintes · plan · mode d'autorisation</text>
  <text x="600" y="207" text-anchor="middle" class="tiny">Définit les contrats, choisit les résultats et assume la réponse finale</text>

  <path d="M470 240V282H192V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M600 240V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M730 240V282H1008V320" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="340" y="273" class="tiny">Contrat de délégation délimité</text>

  <rect x="44" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="357" text-anchor="middle" class="label">Sous-agent A</text>
  <text x="192" y="388" text-anchor="middle" class="note">Parcours du code en lecture seule</text>
  <path d="M72 408H312" fill="none" stroke="#14532d"/>
  <text x="192" y="439" text-anchor="middle" class="note">Livrable : chaîne d'appels et fichiers</text>
  <text x="192" y="469" text-anchor="middle" class="tiny">Contexte indépendant · autorisations héritées</text>
  <text x="192" y="491" text-anchor="middle" class="tiny">Parallélisable avec d'autres tâches en lecture seule</text>

  <rect x="452" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="357" text-anchor="middle" class="label">Sous-agent B</text>
  <text x="600" y="388" text-anchor="middle" class="note">Localiser les tests et la reproduction</text>
  <path d="M480 408H720" fill="none" stroke="#4c1d95"/>
  <text x="600" y="439" text-anchor="middle" class="note">Livrable : commande en échec et journaux</text>
  <text x="600" y="469" text-anchor="middle" class="tiny">Contexte indépendant · autorisations héritées</text>
  <text x="600" y="491" text-anchor="middle" class="tiny">Les conclusions doivent être reproductibles</text>

  <rect x="860" y="320" width="296" height="188" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1008" y="357" text-anchor="middle" class="label">Sous-agent C</text>
  <text x="1008" y="388" text-anchor="middle" class="note">Vérifier les options ou changements récents</text>
  <path d="M888 408H1128" fill="none" stroke="#713f12"/>
  <text x="1008" y="439" text-anchor="middle" class="note">Livrable : options, preuves et risques</text>
  <text x="1008" y="469" text-anchor="middle" class="tiny">Contexte indépendant · autorisations héritées</text>
  <text x="1008" y="491" text-anchor="middle" class="tiny">Ajoute des tokens et un coût de synthèse</text>

  <rect x="44" y="536" width="1112" height="78" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="565" class="lane">Limite d'exécution partagée</text>
  <text x="600" y="566" text-anchor="middle" class="note">Bac à sable et autorisations hérités ; plusieurs Agents peuvent voir le même workspace</text>
  <text x="600" y="594" text-anchor="middle" class="tiny">Les écritures concurrentes entrent en conflit : attribuez la propriété par dossier, composant ou worktree, puis fusionnez dans le fil principal.</text>

  <path d="M192 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M1008 508V535" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M192 614V652H500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M600 614V652" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M1008 614V652H700" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="356" y="652" width="488" height="112" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="690" text-anchor="middle" class="label">L'Agent principal synthétise, résout les conflits et vérifie</text>
  <text x="600" y="721" text-anchor="middle" class="note">Comparer les preuves → décider des modifications → fusionner → relancer tests et build</text>
  <text x="600" y="749" text-anchor="middle" class="tiny">Une sous-tâche terminée ne clôt pas la tâche ; seules des preuves reproductibles étayent la conclusion.</text>
</svg>
