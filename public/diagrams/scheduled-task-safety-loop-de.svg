<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Sicherer Scheduled task-Zyklus</title>
  <desc id="desc">Eine dauerhafte Aufgabe definieren und manuell verifizieren, dann eigenständig oder im Chat sowie Web-Kontext oder lokales Desktop-Projekt mit worktree wählen. Unbeaufsichtigt in der Standard-Sandbox ausführen und Ergebnisse in Scheduled menschlich prüfen. Bei Fehlern Prompt, Werkzeuge oder Frequenz anpassen; ohne Änderungen beenden, vor riskanten Schreibaktionen auf einen Menschen warten.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 19.5px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 10.4px; }
    .label { fill: #f8fafc; font-size: 11.7px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 9.1px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Von manueller Verifizierung zur sicheren Zeitplanung</text>
  <text x="44" y="72" class="sub">Die Zeitplanung löst nur erneut aus; stabile Eingaben, minimale Berechtigungen, Stoppbedingungen und menschliche Prüfung müssen in der Aufgabe stehen.</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. Dauerhafte Aufgabe definieren</text>
  <text x="130" y="219" text-anchor="middle" class="note">Eingabe · Umfang · Abnahme</text>
  <text x="130" y="243" text-anchor="middle" class="note">Keine Änderung · Fehler · Stopp</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">Zuerst jeden wiederkehrenden Schritt festlegen</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. Manuell verifizieren</text>
  <text x="340" y="219" text-anchor="middle" class="note">Gleicher Prompt · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">Gleiche Werkzeuge und Berechtigungen</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">Erst nach prüfbarem Ergebnis einplanen</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. Kontext wählen</text>
  <text x="550" y="219" text-anchor="middle" class="note">Unabhängig: bei jedem Lauf neu starten</text>
  <text x="550" y="243" text-anchor="middle" class="note">Im Chat: Kontext fortführen</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">Nach Unabhängigkeit der Läufe entscheiden</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. Material wählen</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web: Uploads + verbundene Tools</text>
  <text x="760" y="243" text-anchor="middle" class="note">Desktop: Projekt / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web kann keine lokalen Verzeichnisse lesen</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. Unbeaufsichtigt ausführen</text>
  <text x="970" y="219" text-anchor="middle" class="note">Standard-Sandbox verwenden</text>
  <text x="970" y="243" text-anchor="middle" class="note">Nur erforderliche Berechtigungen erteilen</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">Lokal: Computer + App müssen online sein</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Scheduled-Posteingang</text>
  <text x="680" y="390" text-anchor="middle" class="note">Fertig · fehlgeschlagen · prüfen</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">Laufnachweise und Ungelesen-Status bewahren</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">Menschliche Prüfung</text>
  <text x="400" y="390" text-anchor="middle" class="note">Nachweise · diff · externe Nebenwirkungen</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">Kritische Schreibaktionen: Mensch entscheidet</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">Bei zu breiten Ergebnissen, fehlendem Material oder falscher Frequenz: anpassen und erneut manuell verifizieren</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">Jeder Lauf braucht drei klare Pfade</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">Fund: Nachweise liefern · keine Änderung: kurz beenden · nicht ausführbar: stoppen und auf Menschen warten</text>
</svg>
