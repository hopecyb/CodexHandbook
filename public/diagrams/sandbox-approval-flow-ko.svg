<svg lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Codex 샌드박스 및 승인 판단 흐름</title>
  <desc id="desc">Codex가 작업 수행을 위한 동작을 제안하고 먼저 샌드박스 범위 안인지 판단합니다. 범위 안에서는 실행하고 증거를 남기며, 범위 밖에서는 승인 정책에 따라 사람의 결정을 요청합니다. 거부되면 범위를 좁히거나 이유를 설명하고, 승인되면 명시된 동작만 수행합니다. 두 경로 모두 마지막에 결과를 검증합니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.8px; }
    .label { fill: #f8fafc; font-size: 16.3px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.9px; }
    .tiny { fill: #94a3b8; font-size: 11.2px; }
    .edge { fill: #e2e8f0; font-size: 11.2px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="780" rx="8" fill="#020617"/>
  <rect width="1200" height="780" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">샌드박스는 “최대 범위”, 승인은 “경계 초과 전 질문 여부”를 제어</text>
  <text x="44" y="75" class="sub">작업 제약은 의도를 설명하고, 시스템 경계는 실행을 제한하며, diff와 테스트 및 외부 상태가 최종 인수를 담당합니다.</text>

  <rect x="66" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="191" y="158" text-anchor="middle" class="label">작업 목표와 제약</text>
  <text x="191" y="186" text-anchor="middle" class="note">허용 범위 · 금지 동작 · 인수 조건</text>
  <path d="M316 169H390" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="515" y="158" text-anchor="middle" class="label">Codex가 동작 제안</text>
  <text x="515" y="186" text-anchor="middle" class="note">읽기/쓰기 · 명령 · 네트워크 · 앱</text>
  <path d="M640 169H714" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M850 112L986 169L850 226L714 169Z" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="850" y="160" text-anchor="middle" class="label">현재 샌드박스</text>
  <text x="850" y="185" text-anchor="middle" class="label">범위 안인가?</text>

  <path d="M986 169H1080V298" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="1015" y="155" class="edge">예</text>
  <rect x="950" y="298" width="230" height="98" rx="9" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1065" y="335" text-anchor="middle" class="label">경계 안에서 실행</text>
  <text x="1065" y="364" text-anchor="middle" class="note">명령과 출력은 계속 기록</text>

  <path d="M850 226V282H588" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="864" y="258" class="edge">아니요</text>
  <rect x="318" y="282" width="270" height="104" rx="9" fill="#07101f" stroke="#fb7185" stroke-width="1.5"/>
  <text x="453" y="319" text-anchor="middle" class="label">승인 정책의 처리는?</text>
  <text x="453" y="348" text-anchor="middle" class="note">사용자에게 질문하거나 정책에 따라 거부</text>
  <text x="453" y="371" text-anchor="middle" class="tiny">하위 프로세스에도 같은 샌드박스 제약 적용</text>

  <path d="M385 386V445H214" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="314" y="430" class="edge">거부</text>
  <rect x="48" y="445" width="332" height="122" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5"/>
  <text x="214" y="483" text-anchor="middle" class="label">동작 범위를 좁히거나 차단 이유 설명</text>
  <text x="214" y="513" text-anchor="middle" class="note">작업 공간 내부 경로 · 기존 의존성 사용</text>
  <text x="214" y="541" text-anchor="middle" class="tiny">더 위험한 대체 동작으로 몰래 변경하지 않음</text>

  <path d="M521 386V445H684" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="574" y="430" class="edge">승인</text>
  <rect x="518" y="445" width="332" height="122" rx="9" fill="#2a240b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="684" y="483" text-anchor="middle" class="label">명시적으로 승인된 범위만 실행</text>
  <text x="684" y="513" text-anchor="middle" class="note">구체적 명령 · 경로 · 도메인 · 기간</text>
  <text x="684" y="541" text-anchor="middle" class="tiny">새로운 경계 초과 동작은 다시 판단</text>

  <path d="M214 567V637H516" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M684 567V637H638" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1065 396V637H638" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#green-arrow)"/>
  <rect x="390" y="618" width="420" height="108" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="658" text-anchor="middle" class="label">결과와 외부 부작용 검증</text>
  <text x="600" y="687" text-anchor="middle" class="note">diff · 테스트 · 로그 · 원격 상태 · 복구 가능성</text>
  <text x="600" y="712" text-anchor="middle" class="tiny">팝업이 없다고 검토가 불필요한 것은 아니며, 승인을 받았다고 결과가 올바른 것도 아닙니다.</text>
</svg>
