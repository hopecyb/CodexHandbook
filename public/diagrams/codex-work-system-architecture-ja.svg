<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Codex の再利用可能な作業システム構成</title>
  <desc id="desc">タスクプロンプトとプロジェクトルールが Codex タスクに入り、Skills がフロー、MCP が外部ツール、子 Agent が並列探索、Hooks がライフサイクルのガードを提供します。Plugin は機能を配布し、Scheduled task は定時実行を開始し、最終出力は人がレビューします。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 26.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 14.1px; }
    .label { fill: #f8fafc; font-size: 15.8px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.3px; }
    .tiny { fill: #94a3b8; font-size: 10.6px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="720" rx="8" fill="#020617"/>
  <rect width="1200" height="720" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Codex の再利用可能な作業システム</text>
  <text x="44" y="70" class="sub">ルール、フロー、ツール、ガード、配布、トリガーが 1 回のタスクを中心に連携します。互いを置き換える階層ではありません。</text>

  <path d="M222 191H350" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 301H350" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 411H350" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M222 521H350" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 276H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 420H974" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M1068 310V382" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1068 480V540H730" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="42" y="145" width="180" height="92" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="178" text-anchor="middle" class="label">タスクプロンプト</text>
  <text x="132" y="202" text-anchor="middle" class="note">目標 · 入力 · 受け入れ条件</text>
  <text x="132" y="221" text-anchor="middle" class="tiny">現在のタスク固有の要件</text>

  <rect x="42" y="255" width="180" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="132" y="288" text-anchor="middle" class="label">AGENTS.md</text>
  <text x="132" y="312" text-anchor="middle" class="note">プロジェクトルール · コマンド</text>
  <text x="132" y="331" text-anchor="middle" class="tiny">すべてのタスクで読み込む</text>

  <rect x="42" y="365" width="180" height="92" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="132" y="398" text-anchor="middle" class="label">Skill</text>
  <text x="132" y="422" text-anchor="middle" class="note">フロー · 参考資料 · スクリプト</text>
  <text x="132" y="441" text-anchor="middle" class="tiny">タスクに応じて読み込む</text>

  <rect x="42" y="475" width="180" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="132" y="503" text-anchor="middle" class="label">定時タスク</text>
  <text x="132" y="527" text-anchor="middle" class="note">Scheduled task</text>
  <text x="132" y="550" text-anchor="middle" class="tiny">指定時刻に新しい実行を開始</text>

  <rect x="350" y="112" width="470" height="486" rx="12" fill="#07101f" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="370" y="140" class="note" fill="#fbbf24">1 回の Codex タスク実行</text>
  <rect x="390" y="175" width="390" height="84" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="585" y="207" text-anchor="middle" class="label">主 Agent</text>
  <text x="585" y="232" text-anchor="middle" class="note">目標を理解 · 計画を維持 · 証拠を集約</text>

  <rect x="390" y="299" width="170" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="475" y="332" text-anchor="middle" class="label">子 Agent</text>
  <text x="475" y="356" text-anchor="middle" class="note">独立した探索と確認</text>
  <text x="475" y="376" text-anchor="middle" class="tiny">結果を主スレッドへ返す</text>
  <rect x="610" y="299" width="170" height="92" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="332" text-anchor="middle" class="label">MCP / ツール</text>
  <text x="695" y="356" text-anchor="middle" class="note">ファイル · Web · 外部システム</text>
  <text x="695" y="376" text-anchor="middle" class="tiny">権限はホストとサービスが制御</text>
  <path d="M585 259V278H475V297" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M585 259V278H695V297" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="390" y="435" width="390" height="114" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="585" y="468" text-anchor="middle" class="label">Hooks：ライフサイクルのガードレール</text>
  <text x="585" y="495" text-anchor="middle" class="note">実行前チェック · ツール呼び出しポリシー · 実行後監査</text>
  <text x="585" y="520" text-anchor="middle" class="tiny">記録、コンテキスト追加、ブロックが可能。タスク目標は定義しない</text>

  <rect x="974" y="232" width="184" height="78" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="1066" y="263" text-anchor="middle" class="label">レビュー可能な成果物</text>
  <text x="1066" y="287" text-anchor="middle" class="note">ファイル · diff · レポート · 証拠</text>
  <rect x="974" y="382" width="184" height="98" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1066" y="414" text-anchor="middle" class="label">人によるレビュー</text>
  <text x="1066" y="438" text-anchor="middle" class="note">範囲 · 正確性 · リスク</text>
  <text x="1066" y="459" text-anchor="middle" class="tiny">不合格なら証拠を添えて戻す</text>

  <rect x="350" y="626" width="808" height="64" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="754" y="652" text-anchor="middle" class="note">Plugin：Skills、コネクタ、MCP、Hooks、タスクテンプレートをまとめてインストール・配布</text>
  <text x="754" y="676" text-anchor="middle" class="tiny">配布レイヤーにあり、実行経路の最終段階ではない</text>
</svg>
