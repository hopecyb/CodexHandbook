<svg lang="pt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="title desc">
  <title id="title">Roteiro de engenharia de aplicações de IA</title>
  <desc id="desc">Linha do tempo vertical em ordem inversa: de Harness Engineering, Skills, engenharia de contexto, colaboração multiagente, uso de ferramentas, MCP, chamadas de função e engenharia de prompts até RAG. Cada data se refere apenas à publicação do artigo, anúncio ou texto citado.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #111827; font-size: 25.6px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 12.8px; }
    .year { fill: #2563eb; font-size: 14.4px; font-weight: 700; }
    .node-title { fill: #111827; font-size: 14.4px; font-weight: 700; }
    .node-date { fill: #6b7280; font-size: 10.4px; }
    .node-body { fill: #374151; font-size: 11.2px; }
  </style>
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" fill="#ffffff"/>
  <rect x="42" y="34" width="816" height="132" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="86" class="title">Roteiro de engenharia de aplicações de IA</text>
  <text x="72" y="122" class="subtitle">Do mais recente ao mais antigo. As datas são das fontes da tabela, não da origem do conceito.</text>
  <text x="72" y="148" class="subtitle">Leitura vertical: ambiente e reuso → execução conjunta → protocolo de ferramentas → controle de entrada → ancoragem.</text>

  <line x1="224" y1="218" x2="224" y2="1398" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-main)"/>

  <g transform="translate(70 1325)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2020</text>
  </g>
  <g transform="translate(70 1179)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2022</text>
  </g>
  <g transform="translate(70 1033)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2023</text>
  </g>
  <g transform="translate(70 887)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2024</text>
  </g>
  <g transform="translate(70 558)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2025</text>
  </g>
  <g transform="translate(70 229)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="42" y="27" class="year">2026</text>
  </g>
  <g transform="translate(240 202)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#dc2626"/>
    <text x="28" y="32" class="node-title">Harness Engineering (ambiente de execução)</text>
    <text x="28" y="55" class="node-date">2026-02-11 · Ambiente de execução verificável</text>
    <text x="28" y="78" class="node-body">Unir ferramentas, contexto, feedback, recuperação e controle de qualidade num andaime estável.</text>
  </g>
  <g transform="translate(240 348)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Skills (habilidades)</text>
    <text x="28" y="55" class="node-date">2025-10-16 · Unidades de fluxo reutilizáveis</text>
    <text x="28" y="78" class="node-body">Prompts, etapas, exemplos, scripts e recursos: reúso consistente pela IA em tarefas recorrentes.</text>
  </g>
  <g transform="translate(240 470)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Context Engineering (engenharia de contexto)</text>
    <text x="28" y="55" class="node-date">2025-09-29 · Desenho do contexto</text>
    <text x="28" y="78" class="node-body">De “escrever um bom prompt” para “decidir o que o modelo vê e com que prioridade”.</text>
  </g>
  <g transform="translate(240 592)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Multi-agent (colaboração entre agentes)</text>
    <text x="28" y="55" class="node-date">2025-06-13 · Colaboração por papéis</text>
    <text x="28" y="78" class="node-body">Dividir pesquisa, implementação, revisão e verificação entre papéis em paralelo.</text>
  </g>
  <g transform="translate(240 714)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#0d9488"/>
    <text x="28" y="32" class="node-title">Tool Use (uso de ferramentas)</text>
    <text x="28" y="55" class="node-date">2025-03-11 · Execução com várias ferramentas</text>
    <text x="28" y="78" class="node-body">O modelo escolhe ferramentas, chama-as, lê os resultados e continua raciocinando.</text>
  </g>
  <g transform="translate(240 860)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#9333ea"/>
    <text x="28" y="32" class="node-title">MCP (protocolo de contexto de modelo)</text>
    <text x="28" y="55" class="node-date">2024-11-25 · Protocolo de ferramentas</text>
    <text x="28" y="78" class="node-body">Expor ferramentas, recursos, prompts e contexto por protocolo, reduzindo custos de integrações avulsas.</text>
  </g>
  <g transform="translate(240 1006)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#16a34a"/>
    <text x="28" y="32" class="node-title">Function Calling (chamadas de função)</text>
    <text x="28" y="55" class="node-date">2023-06-13 · Ações estruturadas</text>
    <text x="28" y="78" class="node-body">Além de texto, chamar funções, APIs e ações de negócio com parâmetros interpretáveis.</text>
  </g>
  <g transform="translate(240 1152)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#2563eb"/>
    <text x="28" y="32" class="node-title">Prompt Engineering (engenharia de prompts)</text>
    <text x="28" y="55" class="node-date">2022-11-30 · Controle de entrada</text>
    <text x="28" y="78" class="node-body">Guiar o modelo para uma saída útil com instruções, exemplos e restrições de formato.</text>
  </g>
  <g transform="translate(240 1298)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="96" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="96" rx="5" fill="#f97316"/>
    <text x="28" y="32" class="node-title">RAG (geração aumentada por recuperação)</text>
    <text x="28" y="55" class="node-date">2020-05-22 · Ancoragem em conhecimento</text>
    <text x="28" y="78" class="node-body">Buscar fontes externas no contexto, reduzir alucinações e vincular respostas a fontes rastreáveis.</text>
  </g>
</svg>
