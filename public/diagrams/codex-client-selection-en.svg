<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Codex client selection</title>
  <desc id="desc">Start where the work happens: desktop App for local task control, CLI for terminals and scripts, IDE integration for the current file and selection, and Cloud for remote repositories and isolated environments. Entry points can hand work off; choose the one closest to context and easiest to review.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.2px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.4px; }
    .label { fill: #f8fafc; font-size: 16.8px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.6px; }
    .tiny { fill: #94a3b8; font-size: 10.9px; }
    .badge { fill: #020617; font-size: 10.9px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Start with where the work happens, then choose a Codex entry point</text>
  <text x="44" y="75" class="sub">Not a capability ranking or a one-of-four choice. Prefer the entry point closest to context and easiest to review.</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">Where does this work mainly happen?</text>
  <text x="600" y="171" text-anchor="middle" class="note">Task management · terminal · editor · remote repository</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">Default starting point</text>
  <text x="62" y="358" class="label">Desktop App</text>
  <text x="62" y="389" class="note">Local task console</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">View tasks and diffs</text>
  <text x="62" y="469" class="note">Handle approvals and parallel work</text>
  <text x="62" y="497" class="tiny">Best for: first use and long tasks</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">Terminal</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">Command-line and script workflows</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Close to Git and test commands</text>
  <text x="354" y="469" class="note">Easy to record repeatable steps</text>
  <text x="354" y="497" class="tiny">Best for: terminal users and automation</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">Multiple IDEs</text>
  <text x="646" y="358" class="label">IDE integration</text>
  <text x="646" y="389" class="note">Current file and selection</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">Ask with editor context</text>
  <text x="646" y="469" class="note">Edit and review in place</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">Remote execution</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">Remote repository and isolated environment</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">Parallel delegation and longer tasks</text>
  <text x="938" y="469" class="note">Review results together after completion</text>
  <text x="938" y="497" class="tiny">Best for: remote and asynchronous work</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">Entry points can hand work off</text>
  <text x="600" y="640" text-anchor="middle" class="note">Clarify locally in IDE → hand long work to App / Cloud → run team commands in CLI → return to diff review</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">Complete a real loop of reading, editing, diff review, verification, and permission decisions.</text>
</svg>
