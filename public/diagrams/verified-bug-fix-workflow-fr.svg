<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Flux de correction de bug avec vérification</title>
  <desc id="desc">Reproduisez d'abord l'échec de façon stable et consignez les preuves. Localisez la cause racine, appliquez la correction minimale, obtenez le vert sur les tests concernés, puis lancez la régression complète et révisez le diff. Tout échec renvoie à l'étape correspondante.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 23.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.5px; }
    .label { fill: #f8fafc; font-size: 13.3px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 10.9px; }
    .tiny { fill: #94a3b8; font-size: 9.4px; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="590" rx="8" fill="#020617"/>
  <rect width="1100" height="590" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Correction vérifiée : rouge, puis vert, puis régression</text>
  <text x="44" y="70" class="sub">Un test réussi ne prouve la correction qu'après reproduction fiable du problème initial.</text>

  <path d="M186 260H226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M374 260H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M562 260H602" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 260H790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M938 260H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M864 320V410H488V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M676 320V456H300V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="38" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="112" y="235" text-anchor="middle" class="label">1. Reproduire de façon fiable</text>
  <text x="112" y="261" text-anchor="middle" class="note">Exécuter le test en échec</text>
  <text x="112" y="283" text-anchor="middle" class="note">Conserver l'assertion et la pile</text>
  <text x="112" y="304" text-anchor="middle" class="tiny" fill="#fb7185">ROUGE · échec attendu</text>

  <rect x="226" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" class="label">2. Localiser la cause racine</text>
  <text x="300" y="261" text-anchor="middle" class="note">Lire l'implémentation et les tests</text>
  <text x="300" y="283" text-anchor="middle" class="note">Écarter les hypothèses voisines</text>
  <text x="300" y="304" text-anchor="middle" class="tiny">Expliquer d'abord, sans modifier</text>

  <rect x="414" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="488" y="235" text-anchor="middle" class="label">3. Correction minimale</text>
  <text x="488" y="261" text-anchor="middle" class="note">Modifier uniquement la cause racine</text>
  <text x="488" y="283" text-anchor="middle" class="note">Préserver le comportement public</text>
  <text x="488" y="304" text-anchor="middle" class="tiny">Éviter tout refactoring accessoire</text>

  <rect x="602" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="676" y="235" text-anchor="middle" class="label">4. Tests concernés</text>
  <text x="676" y="261" text-anchor="middle" class="note">Le test initial passe au vert</text>
  <text x="676" y="283" text-anchor="middle" class="note">Les tests de limites réussissent</text>
  <text x="676" y="304" text-anchor="middle" class="tiny" fill="#34d399">GREEN</text>

  <rect x="790" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="864" y="235" text-anchor="middle" class="label">5. Régression et révision</text>
  <text x="864" y="261" text-anchor="middle" class="note">Tests complets · lint</text>
  <text x="864" y="283" text-anchor="middle" class="note">Contrôle du diff et du périmètre</text>
  <text x="864" y="304" text-anchor="middle" class="tiny">Consigner les risques résiduels</text>

  <rect x="974" y="218" width="94" height="84" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1021" y="250" text-anchor="middle" class="label">Livrer</text>
  <text x="1021" y="275" text-anchor="middle" class="note">Preuves complètes</text>

  <rect x="154" y="478" width="792" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="504" text-anchor="middle" class="note">Chaîne de preuves : commande et assertion en échec → cause racine → diff minimal → tests concernés réussis → régression complète réussie → révision humaine du périmètre</text>
  <text x="550" y="526" text-anchor="middle" class="tiny">Un échec des tests concernés renvoie à la correction minimale ; un échec de régression ou de révision du diff renvoie à l'analyse de la cause racine.</text>
</svg>
