<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Boucle d'exécution sûre des Scheduled tasks</title>
  <desc id="desc">Définissez une tâche durable et validez-la manuellement. Choisissez ensuite une tâche autonome ou liée au chat, ainsi qu'un contexte Web ou un projet/worktree local. L'exécution sans surveillance utilise le bac à sable par défaut ; le résultat arrive dans Scheduled pour révision humaine. Corrigez le prompt, les outils ou la fréquence en cas d'erreur, terminez sans changement et attendez une personne avant toute écriture risquée.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 20.1px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 10.7px; }
    .label { fill: #f8fafc; font-size: 12.1px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 9.4px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">De la vérification manuelle à la planification sûre</text>
  <text x="44" y="72" class="sub">La planification ne fait que redéclencher ; entrées stables, droits minimaux, conditions d'arrêt et révision humaine doivent figurer dans la tâche.</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. Définir une tâche durable</text>
  <text x="130" y="219" text-anchor="middle" class="note">Entrées · périmètre · acceptation</text>
  <text x="130" y="243" text-anchor="middle" class="note">Aucun changement · échec · arrêt</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">Préciser ce que chaque exécution doit faire</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. Vérifier manuellement</text>
  <text x="340" y="219" text-anchor="middle" class="note">Même prompt · même Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">Mêmes outils et autorisations</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">Planifier après révision manuelle</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. Choisir le contexte</text>
  <text x="550" y="219" text-anchor="middle" class="note">Autonome : redémarre à chaque fois</text>
  <text x="550" y="243" text-anchor="middle" class="note">Dans le chat : conserve le contexte</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">Choisir selon l'indépendance des exécutions</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. Choisir les ressources</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web : imports et outils connectés</text>
  <text x="760" y="243" text-anchor="middle" class="note">Bureau : projet / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Le Web ne peut pas lire les dossiers locaux</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. Exécuter sans surveillance</text>
  <text x="970" y="219" text-anchor="middle" class="note">Utiliser le bac à sable par défaut</text>
  <text x="970" y="243" text-anchor="middle" class="note">Accorder les droits nécessaires</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">Tâche locale : ordinateur + App en ligne</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Boîte de réception Scheduled</text>
  <text x="680" y="390" text-anchor="middle" class="note">Terminé · échec · attention requise</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">Conserver les preuves et l'état non lu</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">Révision humaine</text>
  <text x="400" y="390" text-anchor="middle" class="note">Preuves · diff · effets de bord externes</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">Les écritures critiques restent une décision humaine</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">Résultat trop large, ressources insuffisantes ou fréquence inadaptée : corriger puis revérifier manuellement</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">Chaque exécution doit définir trois chemins</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">Résultat : livrer les preuves · aucun changement : conclure brièvement · impossible : arrêter et attendre une personne</text>
</svg>
