<svg lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Verifizierter Bugfix-Ablauf</title>
  <desc id="desc">Zuerst den Fehler mit einem Test stabil als RED reproduzieren und Nachweise sichern. Dann Ursache finden, minimal beheben und relevante Tests auf GREEN bringen; anschließend vollständige Regression und diff-Review ausführen. Bei Fehlern zum jeweiligen Schritt zurückkehren.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 22.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.2px; }
    .label { fill: #f8fafc; font-size: 12.9px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 10.6px; }
    .tiny { fill: #94a3b8; font-size: 9.1px; }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="590" rx="8" fill="#020617"/>
  <rect width="1100" height="590" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Verifizierter Bugfix: erst RED, dann GREEN, dann Regression</text>
  <text x="44" y="70" class="sub">Ein bestandener Test belegt die Behebung erst, wenn das ursprüngliche Problem zuvor zuverlässig reproduziert wurde.</text>

  <path d="M186 260H226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M374 260H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M562 260H602" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 260H790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M938 260H974" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M864 320V410H488V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>
  <path d="M676 320V456H300V322" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="38" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="112" y="235" text-anchor="middle" class="label">1. Zuverlässig reproduzieren</text>
  <text x="112" y="261" text-anchor="middle" class="note">Fehlschlagenden Test ausführen</text>
  <text x="112" y="283" text-anchor="middle" class="note">Assertion und Stacktrace sichern</text>
  <text x="112" y="304" text-anchor="middle" class="tiny" fill="#fb7185">RED · erwarteter Fehler</text>

  <rect x="226" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" class="label">2. Ursache finden</text>
  <text x="300" y="261" text-anchor="middle" class="note">Implementierung und Tests lesen</text>
  <text x="300" y="283" text-anchor="middle" class="note">Benachbarte Hypothesen ausschließen</text>
  <text x="300" y="304" text-anchor="middle" class="tiny">Zuerst erklären, Code nicht ändern</text>

  <rect x="414" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="488" y="235" text-anchor="middle" class="label">3. Minimale Behebung</text>
  <text x="488" y="261" text-anchor="middle" class="note">Nur den Ursachenpfad ändern</text>
  <text x="488" y="283" text-anchor="middle" class="note">Öffentliches Verhalten bewahren</text>
  <text x="488" y="304" text-anchor="middle" class="tiny">Beiläufiges Refactoring vermeiden</text>

  <rect x="602" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="676" y="235" text-anchor="middle" class="label">4. Relevante Tests</text>
  <text x="676" y="261" text-anchor="middle" class="note">Ursprünglicher Test wird GREEN</text>
  <text x="676" y="283" text-anchor="middle" class="note">Grenzfalltests bestehen</text>
  <text x="676" y="304" text-anchor="middle" class="tiny" fill="#34d399">GREEN</text>

  <rect x="790" y="200" width="148" height="120" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="864" y="235" text-anchor="middle" class="label">5. Regression und Review</text>
  <text x="864" y="261" text-anchor="middle" class="note">Alle Tests · lint</text>
  <text x="864" y="283" text-anchor="middle" class="note">diff- und Umfangsprüfung</text>
  <text x="864" y="304" text-anchor="middle" class="tiny">Restrisiken dokumentieren</text>

  <rect x="974" y="218" width="94" height="84" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1021" y="250" text-anchor="middle" class="label">Ausliefern</text>
  <text x="1021" y="275" text-anchor="middle" class="note">Nachweise vollständig</text>

  <rect x="154" y="478" width="792" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="504" text-anchor="middle" class="note">Nachweiskette: fehlschlagender Befehl und Assertion → Ursachenerklärung → minimaler diff → relevante Tests bestanden → vollständige Regression bestanden → menschliche Umfangsprüfung</text>
  <text x="550" y="526" text-anchor="middle" class="tiny">Bei Fehlern in relevanten Tests zur minimalen Behebung zurückkehren; bei Fehlern in vollständiger Regression oder diff-Review zur Ursachenanalyse.</text>
</svg>
