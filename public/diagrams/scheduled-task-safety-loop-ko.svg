<svg lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Scheduled task 안전 실행 폐루프</title>
  <desc id="desc">지속 가능한 작업을 정의하고 수동 검증한 다음 독립 작업 또는 채팅 내 작업, Web 컨텍스트 또는 데스크톱 로컬 프로젝트와 worktree를 선택합니다. 작업은 기본 샌드박스에서 무인 실행되고 결과는 Scheduled에 들어가 사람이 검토합니다. 문제가 있으면 프롬프트, 도구 또는 빈도를 조정하고, 변화가 없으면 종료하며, 고위험 쓰기 작업은 사람을 기다립니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.2px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.4px; }
    .label { fill: #f8fafc; font-size: 15.1px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.8px; }
    .tiny { fill: #94a3b8; font-size: 10.1px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">수동 검증에서 안전한 정기 실행까지</text>
  <text x="44" y="72" class="sub">예약은 다시 실행되도록 트리거할 뿐입니다. 안정적인 입력, 최소 권한, 중지 조건, 사람의 검토를 작업에 명시해야 합니다.</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. 지속 가능한 작업 정의</text>
  <text x="130" y="219" text-anchor="middle" class="note">입력 · 범위 · 인수 조건</text>
  <text x="130" y="243" text-anchor="middle" class="note">변화 없음 · 실패 · 중지</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">매번 수행할 내용을 먼저 명확히 작성</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. 수동 검증</text>
  <text x="340" y="219" text-anchor="middle" class="note">같은 프롬프트 · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">같은 도구와 권한</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">결과를 검토할 수 있게 된 뒤 예약</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. 컨텍스트 선택</text>
  <text x="550" y="219" text-anchor="middle" class="note">독립 작업: 매번 다시 시작</text>
  <text x="550" y="243" text-anchor="middle" class="note">채팅 내: 컨텍스트 이어가기</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">실행이 서로 독립적인지에 따라 판단</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. 자료 선택</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web: 업로드와 커넥터</text>
  <text x="760" y="243" text-anchor="middle" class="note">데스크톱: 프로젝트 / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web은 로컬 디렉터리를 읽을 수 없음</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. 무인 실행</text>
  <text x="970" y="219" text-anchor="middle" class="note">기본 샌드박스 사용</text>
  <text x="970" y="243" text-anchor="middle" class="note">필요한 권한만 부여</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">로컬 작업에는 컴퓨터와 App이 온라인이어야 함</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Scheduled 받은 편지함</text>
  <text x="680" y="390" text-anchor="middle" class="note">완료 · 실패 · 확인 필요</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">실행 증거와 읽지 않음 상태 유지</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">사람의 검토</text>
  <text x="400" y="390" text-anchor="middle" class="note">증거 · diff · 외부 부작용</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">중요한 쓰기 작업은 여전히 사람이 결정</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">결과 범위가 너무 넓음, 자료 부족 또는 부적절한 빈도: 조정 후 다시 수동 검증</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">각 실행에서 세 경로를 명시</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">발견 있음: 증거 제출 · 변화 없음: 짧게 종료 · 완료 불가: 중지하고 사람 대기</text>
</svg>
