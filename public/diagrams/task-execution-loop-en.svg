<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Loop from task specification to verifiable result</title>
  <desc id="desc">Goal, background, inputs, constraints, acceptance, and permissions form the task. Codex explores, plans, executes, and verifies; failure returns with evidence and success delivers.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.2px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.4px; }
    .label { fill: #f8fafc; font-size: 15.1px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.8px; }
    .tiny { fill: #94a3b8; font-size: 10.1px; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1000" height="560" rx="8" fill="#020617"/>
  <rect width="1000" height="560" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">From task specification to verifiable result</text>
  <text x="44" y="70" class="sub">A good prompt is not the endpoint; it connects execution, evidence, and feedback into a loop.</text>

  <path d="M260 282H310" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M438 282H478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M606 282H646" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M774 282H814" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M878 336V406H770" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M846 336V454H170V378" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rose-arrow)"/>

  <rect x="40" y="112" width="220" height="266" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="142" text-anchor="middle" class="label">Task specification</text>
  <text x="115" y="177" text-anchor="end" class="note">Goal</text><text x="125" y="177" class="tiny">Final deliverable</text>
  <text x="115" y="207" text-anchor="end" class="note">Background</text><text x="125" y="207" class="tiny">Why it matters</text>
  <text x="115" y="237" text-anchor="end" class="note">Inputs</text><text x="125" y="237" class="tiny">Required material</text>
  <text x="115" y="267" text-anchor="end" class="note">Constraints</text><text x="125" y="267" class="tiny">Scope and prohibitions</text>
  <text x="115" y="297" text-anchor="end" class="note">Acceptance</text><text x="125" y="297" class="tiny">Observable evidence</text>
  <text x="115" y="327" text-anchor="end" class="note">Permissions</text><text x="125" y="327" class="tiny">Network · writes · approvals</text>
  <line x1="62" y1="344" x2="228" y2="344" stroke="#1e293b"/>
  <text x="145" y="364" text-anchor="middle" class="tiny">Ask when information is missing; do not guess</text>

  <rect x="310" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="374" y="266" text-anchor="middle" class="label">Explore</text>
  <text x="374" y="291" text-anchor="middle" class="note">Current state · scope</text>
  <text x="374" y="311" text-anchor="middle" class="note">Risks · unknowns</text>

  <rect x="478" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="542" y="266" text-anchor="middle" class="label">Plan</text>
  <text x="542" y="291" text-anchor="middle" class="note">Steps · files</text>
  <text x="542" y="311" text-anchor="middle" class="note">Risks · verification</text>

  <rect x="646" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="266" text-anchor="middle" class="label">Execute</text>
  <text x="710" y="291" text-anchor="middle" class="note">Small edits</text>
  <text x="710" y="311" text-anchor="middle" class="note">Control scope</text>

  <rect x="814" y="230" width="128" height="104" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="878" y="266" text-anchor="middle" class="label">Verify</text>
  <text x="878" y="291" text-anchor="middle" class="note">Tests · diff</text>
  <text x="878" y="311" text-anchor="middle" class="note">Screenshots · sources</text>

  <rect x="490" y="382" width="280" height="62" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="408" text-anchor="middle" class="label">Pass: deliver a verifiable result</text>
  <text x="630" y="429" text-anchor="middle" class="tiny">Artifact + evidence + residual risks</text>
  <text x="905" y="393" class="tiny" fill="#34d399">Pass</text>
  <text x="460" y="472" class="tiny" fill="#fb7185">Fail: return to the task or plan with failure evidence</text>
</svg>
