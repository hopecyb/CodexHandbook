<svg lang="vi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Vòng chạy an toàn của Scheduled task</title>
  <desc id="desc">Trước hết định nghĩa tác vụ bền vững và xác minh thủ công, sau đó chọn tác vụ độc lập hoặc trong cuộc trò chuyện, ngữ cảnh Web hoặc dự án cục bộ và worktree trên máy tính. Tác vụ chạy không giám sát trong sandbox mặc định, kết quả vào Scheduled để con người rà soát; nếu sai thì điều chỉnh prompt, công cụ hoặc tần suất; không có thay đổi thì kết thúc; thao tác ghi rủi ro cao phải chờ con người.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 20.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 10.9px; }
    .label { fill: #f8fafc; font-size: 12.2px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 9.5px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1100" height="650" rx="8" fill="#020617"/>
  <rect width="1100" height="650" rx="8" fill="url(#grid)"/>
  <text x="44" y="46" class="h1">Từ xác minh thủ công đến chạy định kỳ an toàn</text>
  <text x="44" y="72" class="sub">Lịch chỉ kích hoạt lại. Phải ghi đầu vào ổn định, quyền tối thiểu, điều kiện dừng và bước con người rà soát vào tác vụ.</text>

  <path d="M220 220H250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 220H460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 220H670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 220H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="190" text-anchor="middle" class="label">1. Định nghĩa tác vụ bền vững</text>
  <text x="130" y="219" text-anchor="middle" class="note">Đầu vào · phạm vi · tiêu chí chấp nhận</text>
  <text x="130" y="243" text-anchor="middle" class="note">Không thay đổi · thất bại · dừng</text>
  <text x="130" y="265" text-anchor="middle" class="tiny">Ghi rõ việc cần làm trong mỗi lượt trước</text>

  <rect x="250" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="190" text-anchor="middle" class="label">2. Xác minh thủ công</text>
  <text x="340" y="219" text-anchor="middle" class="note">Cùng prompt · Skill</text>
  <text x="340" y="243" text-anchor="middle" class="note">Cùng công cụ và quyền</text>
  <text x="340" y="265" text-anchor="middle" class="tiny">Chỉ lập lịch khi kết quả có thể rà soát</text>

  <rect x="460" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="190" text-anchor="middle" class="label">3. Chọn ngữ cảnh</text>
  <text x="550" y="219" text-anchor="middle" class="note">Tác vụ độc lập: khởi động lại mỗi lần</text>
  <text x="550" y="243" text-anchor="middle" class="note">Trong cuộc trò chuyện: tiếp tục ngữ cảnh</text>
  <text x="550" y="265" text-anchor="middle" class="tiny">Chọn theo mức độc lập giữa các lượt chạy</text>

  <rect x="670" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="190" text-anchor="middle" class="label">4. Chọn tài liệu</text>
  <text x="760" y="219" text-anchor="middle" class="note">Web: tệp tải lên và trình kết nối</text>
  <text x="760" y="243" text-anchor="middle" class="note">Máy tính: dự án / worktree</text>
  <text x="760" y="265" text-anchor="middle" class="tiny">Web không thể đọc thư mục cục bộ</text>

  <rect x="880" y="158" width="180" height="124" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="970" y="190" text-anchor="middle" class="label">5. Chạy không giám sát</text>
  <text x="970" y="219" text-anchor="middle" class="note">Dùng sandbox mặc định</text>
  <text x="970" y="243" text-anchor="middle" class="note">Chỉ cấp quyền cần thiết</text>
  <text x="970" y="265" text-anchor="middle" class="tiny">Tác vụ cục bộ cần máy và App trực tuyến</text>

  <path d="M970 282V350H790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="220" height="106" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="680" y="363" text-anchor="middle" class="label">Hộp thư Scheduled</text>
  <text x="680" y="390" text-anchor="middle" class="note">Hoàn tất · thất bại · cần chú ý</text>
  <text x="680" y="414" text-anchor="middle" class="tiny">Giữ bằng chứng chạy và trạng thái chưa đọc</text>
  <path d="M570 383H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="330" width="240" height="106" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" class="label">Con người rà soát</text>
  <text x="400" y="390" text-anchor="middle" class="note">Bằng chứng · diff · tác dụng phụ bên ngoài</text>
  <text x="400" y="414" text-anchor="middle" class="tiny">Con người vẫn quyết định thao tác ghi quan trọng</text>

  <path d="M400 436V500H130V284" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rose-arrow)"/>
  <text x="265" y="490" text-anchor="middle" class="tiny" fill="#fb7185">Kết quả quá rộng, thiếu tài liệu hoặc tần suất không phù hợp: điều chỉnh rồi xác minh thủ công lại</text>

  <rect x="280" y="526" width="510" height="78" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="535" y="556" text-anchor="middle" class="note">Mỗi lượt chạy phải nêu rõ ba đường</text>
  <text x="535" y="582" text-anchor="middle" class="tiny">Có phát hiện: giao bằng chứng · không thay đổi: kết thúc ngắn gọn · không thể hoàn tất: dừng và chờ con người</text>
</svg>
