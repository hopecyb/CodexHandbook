<svg lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Codex 클라이언트 선택도</title>
  <desc id="desc">작업이 주로 이루어지는 위치에서 시작합니다. 로컬 작업 콘솔은 데스크톱 App, 터미널과 스크립트는 CLI, 현재 파일과 선택 영역은 IDE 통합, 원격 저장소와 격리 환경은 Cloud를 선택합니다. 네 진입점은 이어서 사용할 수 있으며, 현재 컨텍스트에 가깝고 검토하기 쉬운 것을 고르는 것이 원칙입니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 25.8px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13.8px; }
    .label { fill: #f8fafc; font-size: 17.2px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 12.9px; }
    .tiny { fill: #94a3b8; font-size: 11.2px; }
    .badge { fill: #020617; font-size: 11.2px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">작업 위치를 먼저 보고 Codex 진입점 선택</text>
  <text x="44" y="75" class="sub">기능 순위나 사지선다가 아닙니다. 현재 컨텍스트에 가장 가깝고 결과를 검토하기 쉬운 진입점을 우선합니다.</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">이번 작업은 주로 어디에서 이루어집니까?</text>
  <text x="600" y="171" text-anchor="middle" class="note">작업 관리 · 터미널 · 편집기 · 원격 저장소</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">기본 시작점</text>
  <text x="62" y="358" class="label">데스크톱 App</text>
  <text x="62" y="389" class="note">로컬 작업 콘솔</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">작업과 diff 확인</text>
  <text x="62" y="469" class="note">승인과 병렬 작업 처리</text>
  <text x="62" y="497" class="tiny">적합: 첫 사용, 장시간 작업</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">터미널</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">명령줄과 스크립트 흐름</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Git 및 테스트 명령과 가까움</text>
  <text x="354" y="469" class="note">반복 가능한 단계를 기록하기 쉬움</text>
  <text x="354" y="497" class="tiny">적합: 터미널 사용자, 자동화</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">여러 IDE</text>
  <text x="646" y="358" class="label">IDE 통합</text>
  <text x="646" y="389" class="note">현재 파일과 선택 영역</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">편집기 컨텍스트를 포함해 질문</text>
  <text x="646" y="469" class="note">제자리에서 수정하고 검토</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">원격 실행</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">원격 저장소와 격리 환경</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">병렬 위임과 장시간 작업</text>
  <text x="938" y="469" class="note">완료 후 결과를 한곳에서 검토</text>
  <text x="938" y="497" class="tiny">적합: 원격 협업, 비동기 작업</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">진입점 간 인계 가능</text>
  <text x="600" y="640" text-anchor="middle" class="note">IDE에서 국소 문제 확인 → App / Cloud에 장시간 작업 위임 → CLI로 팀 명령 실행 → diff 검토로 복귀</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">선택한 뒤 읽기, 수정, diff, 검증, 권한 판단을 한 번씩 수행해 실제 폐루프를 완성합니다.</text>
</svg>
