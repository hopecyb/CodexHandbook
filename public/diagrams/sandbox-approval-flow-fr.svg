<svg lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">Décision du bac à sable et des approbations Codex</title>
  <desc id="desc">Codex propose une action, puis vérifie le bac à sable. Dans le périmètre, il l'exécute et conserve les preuves ; hors périmètre, la politique sollicite une décision humaine. Un refus réduit l'action ou explique le blocage ; une approbation n'autorise que l'action précisée. Les deux chemins se terminent par une vérification.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 23.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12.5px; }
    .label { fill: #f8fafc; font-size: 14.8px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 11.7px; }
    .tiny { fill: #94a3b8; font-size: 10.1px; }
    .edge { fill: #e2e8f0; font-size: 10.1px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#34d399"/></marker>
    <marker id="rose-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1200" height="780" rx="8" fill="#020617"/>
  <rect width="1200" height="780" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">Le bac à sable fixe la portée maximale ; l'approbation décide s'il faut demander avant de la dépasser</text>
  <text x="44" y="75" class="sub">Les contraintes expriment l'intention ; les limites système encadrent l'exécution ; diff, tests et état externe déterminent l'acceptation.</text>

  <rect x="66" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="191" y="158" text-anchor="middle" class="label">Objectif et contraintes de la tâche</text>
  <text x="191" y="186" text-anchor="middle" class="note">Périmètre autorisé · actions interdites · acceptation</text>
  <path d="M316 169H390" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="122" width="250" height="94" rx="9" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="515" y="158" text-anchor="middle" class="label">Codex propose une action</text>
  <text x="515" y="186" text-anchor="middle" class="note">Lecture/écriture · commande · réseau · application</text>
  <path d="M640 169H714" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M850 112L986 169L850 226L714 169Z" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="850" y="160" text-anchor="middle" class="label">Dans le bac à sable actuel</text>
  <text x="850" y="185" text-anchor="middle" class="label">Dans le périmètre ?</text>

  <path d="M986 169H1080V298" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="1015" y="155" class="edge">Oui</text>
  <rect x="950" y="298" width="230" height="98" rx="9" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1065" y="335" text-anchor="middle" class="label">Exécuter dans les limites</text>
  <text x="1065" y="364" text-anchor="middle" class="note">Toujours consigner commandes et sorties</text>

  <path d="M850 226V282H588" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="864" y="258" class="edge">Non</text>
  <rect x="318" y="282" width="270" height="104" rx="9" fill="#07101f" stroke="#fb7185" stroke-width="1.5"/>
  <text x="453" y="319" text-anchor="middle" class="label">Que prévoit la politique d'approbation ?</text>
  <text x="453" y="348" text-anchor="middle" class="note">Demander à l'utilisateur ou refuser selon la politique</text>
  <text x="453" y="371" text-anchor="middle" class="tiny">Les processus enfants partagent le même bac à sable</text>

  <path d="M385 386V445H214" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#rose-arrow)"/>
  <text x="314" y="430" class="edge">Refusé</text>
  <rect x="48" y="445" width="332" height="122" rx="9" fill="#2a1018" stroke="#fb7185" stroke-width="1.5"/>
  <text x="214" y="483" text-anchor="middle" class="label">Réduire l'action ou expliquer le blocage</text>
  <text x="214" y="513" text-anchor="middle" class="note">Utiliser les chemins du workspace · réutiliser les dépendances</text>
  <text x="214" y="541" text-anchor="middle" class="tiny">Ne jamais substituer discrètement une action plus risquée</text>

  <path d="M521 386V445H684" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="574" y="430" class="edge">Approuvé</text>
  <rect x="518" y="445" width="332" height="122" rx="9" fill="#2a240b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="684" y="483" text-anchor="middle" class="label">Exécuter uniquement le périmètre approuvé</text>
  <text x="684" y="513" text-anchor="middle" class="note">Commande · chemin · domaine · durée précis</text>
  <text x="684" y="541" text-anchor="middle" class="tiny">Réévaluer chaque nouveau dépassement</text>

  <path d="M214 567V637H516" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M684 567V637H638" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1065 396V637H638" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#green-arrow)"/>
  <rect x="390" y="618" width="420" height="108" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="658" text-anchor="middle" class="label">Vérifier résultats et effets de bord externes</text>
  <text x="600" y="687" text-anchor="middle" class="note">diff · tests · journaux · état distant · récupération</text>
  <text x="600" y="712" text-anchor="middle" class="tiny">L'absence de demande ne supprime pas la révision ; une approbation ne prouve pas l'exactitude.</text>
</svg>
