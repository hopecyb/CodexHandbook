<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Codex クライアント選択図</title>
  <desc id="desc">作業の中心となる場所から選びます。ローカルのタスク管理にはデスクトップ App、ターミナルとスクリプトには CLI、現在のファイルや選択範囲には IDE 統合、リモートリポジトリと隔離環境には Cloud を使います。4 つの入口は連携でき、コンテキストに近くレビューしやすいものを選ぶのが原則です。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: 0; }
    .h1 { fill: #f8fafc; font-size: 26.4px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 14.1px; }
    .label { fill: #f8fafc; font-size: 17.6px; font-weight: 700; }
    .note { fill: #cbd5e1; font-size: 13.2px; }
    .tiny { fill: #94a3b8; font-size: 11.4px; }
    .badge { fill: #020617; font-size: 11.4px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" rx="8" fill="#020617"/>
  <rect width="1200" height="760" rx="8" fill="url(#grid)"/>
  <text x="44" y="48" class="h1">作業場所を確認してから Codex の入口を選ぶ</text>
  <text x="44" y="75" class="sub">機能ランキングでも四者択一でもありません。現在のコンテキストに最も近く、結果をレビューしやすい入口を優先します。</text>

  <rect x="390" y="108" width="420" height="92" rx="10" fill="#07101f" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="label">今回の作業は主にどこで行いますか？</text>
  <text x="600" y="171" text-anchor="middle" class="note">タスク管理 · ターミナル · エディタ · リモートリポジトリ</text>

  <path d="M520 200V235H162V278" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <path d="M565 200V245H454V278" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 200V245H746V278" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 200V235H1038V278" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="42" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="62" y="298" width="70" height="24" rx="4" fill="#22d3ee"/>
  <text x="97" y="315" text-anchor="middle" class="badge">標準の開始点</text>
  <text x="62" y="358" class="label">デスクトップ App</text>
  <text x="62" y="389" class="note">ローカルタスクのコントロールセンター</text>
  <path d="M62 410H262" fill="none" stroke="#164e63"/>
  <text x="62" y="441" class="note">タスクと diff を確認</text>
  <text x="62" y="469" class="note">承認と並列作業を管理</text>
  <text x="62" y="497" class="tiny">最適：初回利用、長時間タスク</text>

  <rect x="334" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="354" y="298" width="54" height="24" rx="4" fill="#34d399"/>
  <text x="381" y="315" text-anchor="middle" class="badge">ターミナル</text>
  <text x="354" y="358" class="label">CLI</text>
  <text x="354" y="389" class="note">コマンドラインとスクリプトのフロー</text>
  <path d="M354 410H554" fill="none" stroke="#14532d"/>
  <text x="354" y="441" class="note">Git とテストコマンドに近い</text>
  <text x="354" y="469" class="note">再現可能な手順を記録しやすい</text>
  <text x="354" y="497" class="tiny">最適：ターミナル利用者、自動化</text>

  <rect x="626" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="646" y="298" width="72" height="24" rx="4" fill="#a78bfa"/>
  <text x="682" y="315" text-anchor="middle" class="badge">複数の IDE</text>
  <text x="646" y="358" class="label">IDE 統合</text>
  <text x="646" y="389" class="note">現在のファイルと選択範囲</text>
  <path d="M646 410H846" fill="none" stroke="#4c1d95"/>
  <text x="646" y="441" class="note">エディタのコンテキストを付けて質問</text>
  <text x="646" y="469" class="note">その場で変更してレビュー</text>
  <text x="646" y="497" class="tiny">VS Code · Xcode · JetBrains</text>

  <rect x="918" y="278" width="240" height="248" rx="10" fill="#07101f" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="938" y="298" width="70" height="24" rx="4" fill="#fbbf24"/>
  <text x="973" y="315" text-anchor="middle" class="badge">リモート実行</text>
  <text x="938" y="358" class="label">Cloud</text>
  <text x="938" y="389" class="note">リモートリポジトリと隔離環境</text>
  <path d="M938 410H1138" fill="none" stroke="#713f12"/>
  <text x="938" y="441" class="note">並列委任と長時間タスク</text>
  <text x="938" y="469" class="note">完了後に結果をまとめてレビュー</text>
  <text x="938" y="497" class="tiny">最適：リモート連携、非同期作業</text>

  <path d="M162 526V586H1038V526" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="190" y="574" width="820" height="116" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="610" text-anchor="middle" class="label">入口間で引き継げる</text>
  <text x="600" y="640" text-anchor="middle" class="note">IDE で局所を確認 → App / Cloud に長時間タスクを委任 → CLI でチームコマンドを実行 → diff のレビューに戻る</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">選択後は、読み取り、変更、diff、検証、権限判断を 1 回ずつ行い、実際の閉ループを完了します。</text>
</svg>
