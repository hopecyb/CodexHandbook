name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Reject secrets, generated caches and machine paths
        run: node scripts/check-repo-hygiene.mjs
      - name: Check internal links
        run: pnpm check:links
      - name: Check translation freshness metadata
        run: pnpm i18n:revisions -- --check
      - name: Check required glossary locales
        run: node scripts/check-glossary.mjs
      - name: Check examples index
        run: node scripts/check-examples-index.mjs
      - name: Check all translation structures
        run: pnpm check:i18n -- --all --summary
      - name: Verify deterministic zh-TW generation
        run: node scripts/generate-zh-tw.mjs && node scripts/generate-zh-tw.mjs --check && node scripts/check-zh-tw-fences.mjs
      - name: Run repository tests
        run: node --test scripts/*.test.mjs
      - name: Build production site
        run: pnpm build

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check external links with retries
        run: node scripts/check-external-links.mjs
